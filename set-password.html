<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>معيار | إنشاء كلمة المرور</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<main class="login-page">


    <header class="header">

        <img
            src="assets/logo.png"
            alt="معيار"
            class="logo"
        >

    </header>



    <section class="login-section">


        <div class="login-card">


            <div class="card-header">

                <h1>
                    إنشاء كلمة المرور
                </h1>

                <p>
                    اختر كلمة مرور جديدة لحسابك
                </p>

            </div>



            <form id="passwordForm">


                <div class="input-group">

                    <label for="newPassword">
                        كلمة المرور الجديدة
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="أدخل كلمة المرور الجديدة"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="confirmPassword">
                        تأكيد كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="أعد إدخال كلمة المرور"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>



                <p
                    class="error-message"
                    id="message"
                ></p>



                <button
                    type="submit"
                    class="login-btn"
                    id="saveButton"
                >
                    حفظ كلمة المرور
                </button>



                <button
                    type="button"
                    class="back-btn"
                    id="loginButton"
                >
                    العودة إلى تسجيل الدخول
                </button>


            </form>


        </div>


    </section>


</main>



<script>


const SUPABASE_URL =
    "https://avooyglxacytrfhvotsl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_NVlWEnA_w4KbSse_-70zdA_J9ut0Kyo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



const passwordForm =
    document.getElementById(
        "passwordForm"
    );


const newPasswordInput =
    document.getElementById(
        "newPassword"
    );


const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );


const message =
    document.getElementById(
        "message"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );



function showMessage(
    text,
    success = false
) {


    message.textContent =
        text;


    message.classList.toggle(
        "success-message",
        success
    );

}



/* =========================================
   التأكد من وجود جلسة استعادة
========================================= */

async function checkRecoverySession() {


    /*
        Supabase يعالج رابط البريد
        ويُنشئ جلسة للمستخدم.

        نتحقق هنا أن هناك مستخدماً
        مسجلاً فعلياً.
    */


    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();



    if (
        error
        ||
        !data.user
    ) {


        showMessage(
            "رابط إنشاء كلمة المرور غير صالح أو انتهت صلاحيته"
        );


        saveButton.disabled =
            true;


        return false;

    }


    return true;

}



/* =========================================
   حفظ كلمة المرور
========================================= */

passwordForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        showMessage(
            ""
        );


        const newPassword =
            newPasswordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;



        if (
            !newPassword
            ||
            !confirmPassword
        ) {


            showMessage(
                "يرجى تعبئة جميع الحقول"
            );


            return;

        }



        if (
            newPassword.length < 6
        ) {


            showMessage(
                "كلمة المرور يجب أن تكون 6 أحرف على الأقل"
            );


            return;

        }



        if (
            newPassword !==
            confirmPassword
        ) {


            showMessage(
                "كلمتا المرور غير متطابقتين"
            );


            return;

        }



        saveButton.disabled =
            true;


        saveButton.textContent =
            "جارٍ الحفظ...";



        try {


            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .updateUser({

                    password:
                        newPassword

                });



            if (
                error
                ||
                !data.user
            ) {


                console.error(
                    error
                );


                showMessage(
                    "تعذر حفظ كلمة المرور"
                );


                return;

            }



            showMessage(
                "تم إنشاء كلمة المرور بنجاح",
                true
            );



            setTimeout(
                async function() {


                    await supabaseClient
                        .auth
                        .signOut();


                    window.location.href =
                        "login.html";


                },
                1200
            );


        }


        catch(error) {


            console.error(
                error
            );


            showMessage(
                "حدث خطأ أثناء حفظ كلمة المرور"
            );


        }


        finally {


            saveButton.disabled =
                false;


            saveButton.textContent =
                "حفظ كلمة المرور";


        }


    }
);



document
    .getElementById(
        "loginButton"
    )
    .addEventListener(
        "click",
        function() {


            window.location.href =
                "login.html";


        }
    );



checkRecoverySession();


</script>


</body>

</html>
