<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>معيار | تسجيل الدخول</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<main class="login-page">


    <header class="header">

        <img
            src="assets/logo.png"
            alt="معيار"
            class="logo"
        >

    </header>



    <section class="login-section">


        <div class="login-card">


            <div class="card-header">

                <h1>
                    تسجيل الدخول
                </h1>

                <p id="loginDescription">
                    أدخل بريدك الإلكتروني وكلمة المرور
                </p>

            </div>



            <div class="role-title">
                نوع المستخدم
            </div>


            <div class="role-options">


                <button
                    type="button"
                    class="role-btn active"
                    id="employeeBtn"
                >

                    <span class="radio-circle"></span>

                    موظف

                </button>


                <button
                    type="button"
                    class="role-btn"
                    id="adminBtn"
                >

                    <span class="radio-circle"></span>

                    مسؤول

                </button>


            </div>



            <form id="loginForm">


                <div class="input-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="loginSecret">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="loginSecret"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    >

                </div>



                <p
                    class="employee-note"
                    id="employeeNote"
                >
                    إذا كانت هذه أول مرة تدخل فيها، فعّل حسابك أولاً.
                </p>



                <p
                    class="error-message"
                    id="errorMessage"
                ></p>



                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    تسجيل الدخول
                </button>



                <button
                    type="button"
                    class="back-btn"
                    id="activateButton"
                >
                    تفعيل حساب الموظف لأول مرة
                </button>



                <button
                    type="button"
                    class="back-btn"
                    id="forgotPasswordButton"
                >
                    نسيت كلمة المرور
                </button>



                <button
                    type="button"
                    class="back-btn"
                    id="backButton"
                >
                    العودة إلى الصفحة الرئيسية
                </button>


            </form>


        </div>


    </section>


</main>



<script>


/* =========================================
   Supabase
========================================= */

const SUPABASE_URL =
    "https://avooyglxacytrfhvotsl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_NVlWEnA_w4KbSse_-70zdA_J9ut0Kyo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   إعدادات النظام
========================================= */

const ADMIN_EMAIL =
    "admin@gmail.com";


let selectedRole =
    "employee";



/* =========================================
   العناصر
========================================= */

const employeeBtn =
    document.getElementById(
        "employeeBtn"
    );


const adminBtn =
    document.getElementById(
        "adminBtn"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const secretInput =
    document.getElementById(
        "loginSecret"
    );


const employeeNote =
    document.getElementById(
        "employeeNote"
    );


const loginDescription =
    document.getElementById(
        "loginDescription"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const activateButton =
    document.getElementById(
        "activateButton"
    );


const forgotPasswordButton =
    document.getElementById(
        "forgotPasswordButton"
    );



/* =========================================
   رسالة
========================================= */

function showMessage(
    message,
    success = false
) {


    errorMessage.textContent =
        message;


    errorMessage.classList.toggle(
        "success-message",
        success
    );

}



/* =========================================
   تنظيف التخزين المحلي
========================================= */

function clearLocalData() {


    localStorage.removeItem(
        "miyarRole"
    );


    localStorage.removeItem(
        "miyarEmail"
    );


    localStorage.removeItem(
        "miyarEmployeeId"
    );


    localStorage.removeItem(
        "miyarEmployeeName"
    );

}



/* =========================================
   اختيار نوع المستخدم
========================================= */

function selectRole(role) {


    selectedRole =
        role;


    employeeBtn.classList.remove(
        "active"
    );


    adminBtn.classList.remove(
        "active"
    );


    showMessage(
        ""
    );


    if (
        role === "employee"
    ) {


        employeeBtn.classList.add(
            "active"
        );


        loginDescription.textContent =
            "أدخل بريدك الإلكتروني وكلمة المرور";


        employeeNote.style.display =
            "block";


        activateButton.style.display =
            "block";


        forgotPasswordButton.style.display =
            "block";


    }


    else {


        adminBtn.classList.add(
            "active"
        );


        loginDescription.textContent =
            "أدخل بيانات حساب المسؤول";


        employeeNote.style.display =
            "none";


        activateButton.style.display =
            "none";


        forgotPasswordButton.style.display =
            "none";


    }

}



/* =========================================
   تسجيل الدخول
========================================= */

async function signIn(
    email,
    password
) {


    /*
        ننهي الجلسة القديمة أولاً
        حتى لا تختلط جلسة المسؤول والموظف
    */

    try {


        await supabaseClient
            .auth
            .signOut();


    }


    catch(error) {


        console.log(
            error
        );


    }


    clearLocalData();



    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .signInWithPassword({

            email:
                email,

            password:
                password

        });



    if (
        error
        ||
        !data.user
    ) {


        console.error(
            error
        );


        return null;

    }


    return data.user;

}



/* =========================================
   دخول الموظف
========================================= */

async function loginEmployee(
    email,
    password
) {


    if (
        email ===
        ADMIN_EMAIL
    ) {


        showMessage(
            "هذا الحساب مخصص للمسؤول"
        );


        return false;

    }



    const user =
        await signIn(
            email,
            password
        );


    if (!user) {


        showMessage(
            "البريد الإلكتروني أو كلمة المرور غير صحيحة"
        );


        return false;

    }



    const {
        data: employee,
        error
    } =
    await supabaseClient
        .from(
            "employees"
        )
        .select(`
            id,
            name,
            email,
            employee_number,
            auth_user_id,
            employment_status
        `)
        .eq(
            "auth_user_id",
            user.id
        )
        .maybeSingle();



    if (error) {


        console.error(
            error
        );


        await supabaseClient
            .auth
            .signOut();


        showMessage(
            "تعذر التحقق من بيانات الموظف"
        );


        return false;

    }



    if (!employee) {


        await supabaseClient
            .auth
            .signOut();


        showMessage(
            "الحساب غير مرتبط بملف موظف"
        );


        return false;

    }



    localStorage.setItem(
        "miyarRole",
        "employee"
    );


    localStorage.setItem(
        "miyarEmail",
        employee.email || email
    );


    localStorage.setItem(
        "miyarEmployeeId",
        String(employee.id)
    );


    localStorage.setItem(
        "miyarEmployeeName",
        employee.name || ""
    );


    window.location.href =
        "employee-home.html";


    return true;

}



/* =========================================
   دخول المسؤول
========================================= */

async function loginAdmin(
    email,
    password
) {


    if (
        email !==
        ADMIN_EMAIL
    ) {


        showMessage(
            "هذا الحساب غير مصرح له بالدخول كمسؤول"
        );


        return false;

    }



    const user =
        await signIn(
            email,
            password
        );


    if (!user) {


        showMessage(
            "البريد الإلكتروني أو كلمة المرور غير صحيحة"
        );


        return false;

    }



    const authEmail =
        String(
            user.email || ""
        )
        .trim()
        .toLowerCase();



    if (
        authEmail !==
        ADMIN_EMAIL
    ) {


        await supabaseClient
            .auth
            .signOut();


        showMessage(
            "هذا الحساب غير مصرح له بالدخول كمسؤول"
        );


        return false;

    }



    localStorage.setItem(
        "miyarRole",
        "admin"
    );


    localStorage.setItem(
        "miyarEmail",
        authEmail
    );


    window.location.href =
        "dashboard.html";


    return true;

}



/* =========================================
   إرسال النموذج
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        showMessage(
            ""
        );


        const email =
            emailInput
                .value
                .trim()
                .toLowerCase();


        const password =
            secretInput
                .value;


        if (
            !email
            ||
            !password
        ) {


            showMessage(
                "يرجى إدخال البريد الإلكتروني وكلمة المرور"
            );


            return;

        }



        if (
            password.length < 6
        ) {


            showMessage(
                "كلمة المرور يجب أن تكون 6 أحرف على الأقل"
            );


            return;

        }



        loginButton.disabled =
            true;


        loginButton.textContent =
            "جارٍ تسجيل الدخول...";



        try {


            if (
                selectedRole ===
                "employee"
            ) {


                await loginEmployee(
                    email,
                    password
                );


            }


            else {


                await loginAdmin(
                    email,
                    password
                );


            }


        }


        catch(error) {


            console.error(
                error
            );


            showMessage(
                "حدث خطأ أثناء تسجيل الدخول"
            );


        }


        finally {


            loginButton.disabled =
                false;


            loginButton.textContent =
                "تسجيل الدخول";


        }


    }
);



/* =========================================
   تفعيل حساب الموظف
========================================= */

activateButton.addEventListener(
    "click",
    function() {


        showMessage(
            "لتفعيل الحساب لأول مرة يجب أن تصل دعوة الموظف إلى بريده المسجل. افتح رسالة الدعوة وحدد كلمة المرور الخاصة بك."
        );


    }
);



/* =========================================
   نسيت كلمة المرور
========================================= */

forgotPasswordButton.addEventListener(
    "click",
    async function() {


        const email =
            emailInput
                .value
                .trim()
                .toLowerCase();



        if (!email) {


            showMessage(
                "أدخل بريدك الإلكتروني أولاً"
            );


            return;

        }



        if (
            email ===
            ADMIN_EMAIL
        ) {


            showMessage(
                "استخدم دخول المسؤول لهذا الحساب"
            );


            return;

        }



        try {


            /*
                نرسل رابط استعادة كلمة المرور.

                بعد فتح الرابط يتم توجيه الموظف
                إلى set-password.html
            */

            const redirectTo =
                new URL(
                    "set-password.html",
                    window.location.href
                ).href;



            const {
                error
            } =
            await supabaseClient
                .auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            redirectTo
                    }
                );



            if (error) {


                console.error(
                    error
                );


                showMessage(
                    "تعذر إرسال رابط إنشاء كلمة المرور"
                );


                return;

            }



            showMessage(
                "إذا كان البريد مسجلاً، ستصلك رسالة لإنشاء كلمة المرور.",
                true
            );


        }


        catch(error) {


            console.error(
                error
            );


            showMessage(
                "حدث خطأ أثناء إرسال الرسالة"
            );


        }


    }
);



/* =========================================
   الأزرار
========================================= */

employeeBtn.addEventListener(
    "click",
    function() {


        selectRole(
            "employee"
        );


    }
);


adminBtn.addEventListener(
    "click",
    function() {


        selectRole(
            "admin"
        );


    }
);



document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function() {


            window.location.href =
                "home.html";


        }
    );



/* =========================================
   الوضع الافتراضي
========================================= */

selectRole(
    "employee"
);


</script>


</body>

</html>
