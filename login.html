<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>معيار | تسجيل الدخول</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<main class="login-page">


    <header class="header">

        <img
            src="assets/logo.png"
            alt="معيار"
            class="logo"
        >

    </header>



    <section class="login-section">


        <div class="login-card">


            <div class="card-header">

                <h1>
                    تسجيل الدخول
                </h1>

                <p id="loginDescription">
                    أدخل بريدك الإلكتروني وكلمة المرور
                </p>

            </div>



            <!-- نوع المستخدم -->

            <div class="role-title">
                نوع المستخدم
            </div>


            <div class="role-options">


                <button
                    type="button"
                    class="role-btn active"
                    id="employeeBtn"
                >

                    <span class="radio-circle"></span>

                    موظف

                </button>


                <button
                    type="button"
                    class="role-btn"
                    id="adminBtn"
                >

                    <span class="radio-circle"></span>

                    مسؤول

                </button>


            </div>



            <form id="loginForm">


                <!-- البريد -->

                <div class="input-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- كلمة المرور -->

                <div class="input-group">

                    <label
                        for="loginSecret"
                        id="secretLabel"
                    >
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="loginSecret"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    >

                </div>



                <!-- ملاحظة الموظف -->

                <p
                    class="employee-note"
                    id="employeeNote"
                >
                    استخدم البريد الإلكتروني وكلمة المرور الخاصة بحسابك.
                </p>



                <!-- رسالة الخطأ -->

                <p
                    class="error-message"
                    id="errorMessage"
                ></p>



                <!-- تسجيل الدخول -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    تسجيل الدخول
                </button>



                <!-- العودة -->

                <button
                    type="button"
                    class="back-btn"
                    id="backButton"
                >
                    العودة إلى الصفحة الرئيسية
                </button>


            </form>


        </div>


    </section>


</main>



<script>


/* =========================================
   Supabase
========================================= */

const SUPABASE_URL =
    "https://avooyglxacytrfhvotsl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_NVlWEnA_w4KbSse_-70zdA_J9ut0Kyo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   إعدادات النظام
========================================= */

const ADMIN_EMAIL =
    "admin@gmail.com";


let selectedRole =
    "employee";



/* =========================================
   العناصر
========================================= */

const employeeBtn =
    document.getElementById(
        "employeeBtn"
    );


const adminBtn =
    document.getElementById(
        "adminBtn"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const secretInput =
    document.getElementById(
        "loginSecret"
    );


const secretLabel =
    document.getElementById(
        "secretLabel"
    );


const employeeNote =
    document.getElementById(
        "employeeNote"
    );


const loginDescription =
    document.getElementById(
        "loginDescription"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );



/* =========================================
   تنظيف بيانات الدخول القديمة
========================================= */

function clearStoredLoginData() {


    localStorage.removeItem(
        "miyarRole"
    );


    localStorage.removeItem(
        "miyarEmail"
    );


    localStorage.removeItem(
        "miyarEmployeeId"
    );


    localStorage.removeItem(
        "miyarEmployeeName"
    );

}



/* =========================================
   تسجيل الخروج من أي جلسة قديمة
========================================= */

async function clearOldSession() {


    try {


        await supabaseClient
            .auth
            .signOut();


    }


    catch(error) {


        console.log(
            "لا توجد جلسة سابقة"
        );


    }


    clearStoredLoginData();

}



/* =========================================
   اختيار نوع المستخدم
========================================= */

function selectRole(role) {


    selectedRole =
        role;


    employeeBtn.classList.remove(
        "active"
    );


    adminBtn.classList.remove(
        "active"
    );


    errorMessage.textContent =
        "";


    errorMessage.classList.remove(
        "success-message"
    );


    secretInput.value =
        "";


    if (
        role === "employee"
    ) {


        employeeBtn.classList.add(
            "active"
        );


        loginDescription.textContent =
            "أدخل بريدك الإلكتروني وكلمة المرور";


        secretLabel.textContent =
            "كلمة المرور";


        secretInput.type =
            "password";


        secretInput.placeholder =
            "أدخل كلمة المرور";


        secretInput.setAttribute(
            "minlength",
            "6"
        );


        secretInput.setAttribute(
            "autocomplete",
            "current-password"
        );


        employeeNote.style.display =
            "block";


        employeeNote.textContent =
            "استخدم البريد الإلكتروني وكلمة المرور الخاصة بحسابك.";


    }


    else {


        adminBtn.classList.add(
            "active"
        );


        loginDescription.textContent =
            "أدخل بيانات حساب المسؤول";


        secretLabel.textContent =
            "كلمة المرور";


        secretInput.type =
            "password";


        secretInput.placeholder =
            "أدخل كلمة المرور";


        secretInput.setAttribute(
            "minlength",
            "6"
        );


        secretInput.setAttribute(
            "autocomplete",
            "current-password"
        );


        employeeNote.style.display =
            "none";


    }

}



/* =========================================
   تسجيل الدخول في Supabase Authentication
========================================= */

async function signInWithSupabase(
    email,
    password
) {


    /*
        إنهاء أي جلسة قديمة.

        هذا يمنع بقاء جلسة المسؤول
        عند محاولة الدخول بحساب موظف.
    */


    await clearOldSession();



    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .signInWithPassword({

            email:
                email,

            password:
                password

        });



    if (
        error
        ||
        !data
        ||
        !data.user
    ) {


        console.error(
            "خطأ تسجيل الدخول:",
            error
        );


        return null;

    }



    return data.user;

}



/* =========================================
   البحث عن الموظف بواسطة Auth User ID
========================================= */

async function getEmployeeByAuthUserId(
    authUserId
) {


    const {
        data,
        error
    } =
    await supabaseClient
        .from(
            "employees"
        )
        .select(`
            id,
            name,
            email,
            employee_number,
            auth_user_id,
            employment_status
        `)
        .eq(
            "auth_user_id",
            authUserId
        )
        .maybeSingle();



    if (error) {


        console.error(
            "خطأ جلب بيانات الموظف:",
            error
        );


        return {
            employee: null,
            error: error
        };

    }



    return {
        employee: data,
        error: null
    };

}



/* =========================================
   دخول الموظف
========================================= */

async function loginEmployee(
    email,
    password
) {


    /*
        منع بريد المسؤول من الدخول
        من خيار موظف
    */

    if (
        email ===
        ADMIN_EMAIL.toLowerCase()
    ) {


        errorMessage.textContent =
            "هذا حساب مسؤول، يرجى اختيار مسؤول";


        return false;

    }



    /*
        تسجيل الدخول الحقيقي
        في Supabase Auth
    */

    const user =
        await signInWithSupabase(
            email,
            password
        );



    if (!user) {


        errorMessage.textContent =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة";


        return false;

    }



    /*
        التأكد أن الحساب
        ليس حساب المسؤول
    */

    const authEmail =
        String(
            user.email || ""
        )
        .trim()
        .toLowerCase();



    if (
        authEmail ===
        ADMIN_EMAIL.toLowerCase()
    ) {


        await clearOldSession();


        errorMessage.textContent =
            "هذا الحساب مخصص للمسؤول";


        return false;

    }



    /*
        جلب الملف الوظيفي المرتبط
        بحساب Authentication
    */

    const result =
        await getEmployeeByAuthUserId(
            user.id
        );


    const employee =
        result.employee;



    if (
        result.error
    ) {


        await clearOldSession();


        errorMessage.textContent =
            "تعذر التحقق من بيانات الموظف";


        return false;

    }



    /*
        إذا الحساب موجود في Auth
        لكنه غير مربوط بموظف
    */

    if (!employee) {


        await clearOldSession();


        errorMessage.textContent =
            "هذا الحساب غير مرتبط بملف موظف";


        return false;

    }



    /*
        مقارنة البريد الموجود في Auth
        بالبريد الموجود في جدول الموظفين
    */

    const employeeEmail =
        String(
            employee.email || ""
        )
        .trim()
        .toLowerCase();



    if (
        employeeEmail
        &&
        authEmail
        &&
        employeeEmail !== authEmail
    ) {


        await clearOldSession();


        errorMessage.textContent =
            "البريد غير مرتبط ببيانات هذا الموظف";


        return false;

    }



    /*
        حماية إضافية
        لمنع حساب المسؤول
        من الظهور كموظف
    */

    if (
        employeeEmail ===
        ADMIN_EMAIL.toLowerCase()
    ) {


        await clearOldSession();


        errorMessage.textContent =
            "هذا الحساب مخصص للمسؤول";


        return false;

    }



    /*
        حفظ البيانات للتوافق
        مع بقية صفحات الموظف القديمة.

        لكن التحقق الحقيقي أصبح Auth.
    */

    localStorage.setItem(
        "miyarRole",
        "employee"
    );


    localStorage.setItem(
        "miyarEmail",
        employee.email || authEmail
    );


    localStorage.setItem(
        "miyarEmployeeId",
        String(employee.id)
    );


    localStorage.setItem(
        "miyarEmployeeName",
        employee.name || ""
    );



    /*
        الانتقال إلى الصفحة الرئيسية
        الخاصة بالموظف
    */

    window.location.href =
        "employee-home.html";


    return true;

}



/* =========================================
   دخول المسؤول
========================================= */

async function loginAdmin(
    email,
    password
) {


    /*
        لا يسمح بالدخول كمسؤول
        إلا بالبريد المحدد
    */

    if (
        email !==
        ADMIN_EMAIL.toLowerCase()
    ) {


        errorMessage.textContent =
            "هذا الحساب غير مصرح له بالدخول كمسؤول";


        return false;

    }



    /*
        تسجيل الدخول
        في Supabase Auth
    */

    const user =
        await signInWithSupabase(
            email,
            password
        );



    if (!user) {


        errorMessage.textContent =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة";


        return false;

    }



    /*
        نتأكد مرة أخرى من البريد
        الموجود داخل جلسة Auth نفسها
    */

    const authEmail =
        String(
            user.email || ""
        )
        .trim()
        .toLowerCase();



    if (
        authEmail !==
        ADMIN_EMAIL.toLowerCase()
    ) {


        await clearOldSession();


        errorMessage.textContent =
            "هذا الحساب غير مصرح له بالدخول كمسؤول";


        return false;

    }



    /*
        حفظ بيانات المسؤول
    */

    localStorage.setItem(
        "miyarRole",
        "admin"
    );


    localStorage.setItem(
        "miyarEmail",
        authEmail
    );


    localStorage.removeItem(
        "miyarEmployeeId"
    );


    localStorage.removeItem(
        "miyarEmployeeName"
    );



    /*
        الانتقال إلى لوحة المسؤول
    */

    window.location.href =
        "dashboard.html";


    return true;

}



/* =========================================
   إرسال نموذج تسجيل الدخول
========================================= */

loginForm
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();



            errorMessage.textContent =
                "";


            errorMessage.classList.remove(
                "success-message"
            );



            const email =
                emailInput
                    .value
                    .trim()
                    .toLowerCase();



            const password =
                secretInput
                    .value;



            /*
                التأكد من تعبئة البيانات
            */

            if (
                !email
                ||
                !password
            ) {


                errorMessage.textContent =
                    "يرجى إدخال البريد الإلكتروني وكلمة المرور";


                return;

            }



            /*
                الحد الأدنى لكلمة المرور
            */

            if (
                password.length < 6
            ) {


                errorMessage.textContent =
                    "كلمة المرور يجب أن تكون 6 أحرف على الأقل";


                return;

            }



            /*
                تعطيل الزر أثناء الدخول
            */

            loginButton.disabled =
                true;


            loginButton.textContent =
                "جارٍ تسجيل الدخول...";



            try {


                /*
                    دخول موظف
                */

                if (
                    selectedRole ===
                    "employee"
                ) {


                    await loginEmployee(
                        email,
                        password
                    );


                }


                /*
                    دخول مسؤول
                */

                else {


                    await loginAdmin(
                        email,
                        password
                    );


                }


            }


            catch(error) {


                console.error(
                    "خطأ تسجيل الدخول:",
                    error
                );


                errorMessage.textContent =
                    "حدث خطأ أثناء تسجيل الدخول";


            }


            finally {


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "تسجيل الدخول";


            }


        }
    );



/* =========================================
   اختيار موظف
========================================= */

employeeBtn
    .addEventListener(
        "click",
        function() {


            selectRole(
                "employee"
            );


        }
    );



/* =========================================
   اختيار مسؤول
========================================= */

adminBtn
    .addEventListener(
        "click",
        function() {


            selectRole(
                "admin"
            );


        }
    );



/* =========================================
   العودة إلى الصفحة الرئيسية
========================================= */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function() {


            window.location.href =
                "home.html";


        }
    );



/* =========================================
   الحالة الافتراضية
========================================= */

selectRole(
    "employee"
);


</script>


</body>

</html>
