<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>معيار | تسجيل الدخول</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>

<main class="login-page">

    <header class="header">

        <img
            src="assets/logo.png"
            alt="معيار"
            class="logo"
        >

    </header>


    <section class="login-section">

        <div class="login-card">

            <div class="card-header">

                <h1>
                    تسجيل الدخول
                </h1>

                <p id="loginDescription">
                    أدخل بريدك الإلكتروني لإرسال رمز التحقق
                </p>

            </div>


            <!-- نوع المستخدم -->

            <div class="role-title">
                نوع المستخدم
            </div>


            <div class="role-options">

                <button
                    type="button"
                    class="role-btn active"
                    id="employeeBtn"
                >
                    <span class="radio-circle"></span>
                    موظف
                </button>


                <button
                    type="button"
                    class="role-btn"
                    id="adminBtn"
                >
                    <span class="radio-circle"></span>
                    مسؤول
                </button>

            </div>


            <!-- =====================================
                 الموظف
            ====================================== -->

            <form
                id="employeeForm"
                class="login-form"
            >

                <div class="input-group">

                    <label for="employeeEmail">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="employeeEmail"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- إرسال الرمز -->

                <button
                    type="button"
                    class="login-btn"
                    id="sendCodeBtn"
                >
                    إرسال رمز التحقق
                </button>


                <!-- خانة الرمز -->

                <div
                    class="otp-section"
                    id="otpSection"
                >

                    <div class="otp-divider">

                        <span>
                            رمز التحقق
                        </span>

                    </div>


                    <div class="input-group otp-group">

                        <label for="otpCode">
                            أدخل الرمز المرسل إلى بريدك
                        </label>

                        <input
                            type="text"
                            id="otpCode"
                            class="otp-input"
                            placeholder="000000"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-btn"
                        id="verifyCodeBtn"
                    >
                        تحقق ودخول
                    </button>


                    <button
                        type="button"
                        class="resend-btn"
                        id="resendCodeBtn"
                    >
                        إعادة إرسال الرمز
                    </button>

                </div>


                <p
                    class="error-message"
                    id="employeeMessage"
                ></p>

            </form>



            <!-- =====================================
                 المسؤول
            ====================================== -->

            <form
                id="adminForm"
                class="login-form hidden"
            >

                <div class="input-group">

                    <label for="adminEmail">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="adminPassword">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="adminLoginBtn"
                >
                    تسجيل الدخول
                </button>


                <p
                    class="error-message"
                    id="adminMessage"
                ></p>

            </form>

        </div>

    </section>

</main>



<script>

/* =========================================
   Supabase
========================================= */

const SUPABASE_URL =
    "https://avooyglxacytrfhvotsl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_NVlWEnA_w4KbSse_-70zdA_J9ut0Kyo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   إعدادات
========================================= */

const ADMIN_EMAIL =
    "admin@gmail.com";


let selectedRole =
    "employee";


let otpEmail =
    "";


/* =========================================
   العناصر
========================================= */

const employeeBtn =
    document.getElementById("employeeBtn");


const adminBtn =
    document.getElementById("adminBtn");


const loginDescription =
    document.getElementById("loginDescription");


const employeeForm =
    document.getElementById("employeeForm");


const adminForm =
    document.getElementById("adminForm");


const employeeEmail =
    document.getElementById("employeeEmail");


const sendCodeBtn =
    document.getElementById("sendCodeBtn");


const otpSection =
    document.getElementById("otpSection");


const otpCode =
    document.getElementById("otpCode");


const verifyCodeBtn =
    document.getElementById("verifyCodeBtn");


const resendCodeBtn =
    document.getElementById("resendCodeBtn");


const employeeMessage =
    document.getElementById("employeeMessage");


const adminEmail =
    document.getElementById("adminEmail");


const adminPassword =
    document.getElementById("adminPassword");


const adminLoginBtn =
    document.getElementById("adminLoginBtn");


const adminMessage =
    document.getElementById("adminMessage");


/* =========================================
   رسائل
========================================= */

function showEmployeeMessage(
    message,
    success = false
) {

    employeeMessage.textContent =
        message;

    employeeMessage.classList.toggle(
        "success-message",
        success
    );

}


function showAdminMessage(
    message,
    success = false
) {

    adminMessage.textContent =
        message;

    adminMessage.classList.toggle(
        "success-message",
        success
    );

}


/* =========================================
   تنظيف بيانات الجلسة القديمة
========================================= */

function clearLocalData() {

    localStorage.removeItem(
        "miyarRole"
    );

    localStorage.removeItem(
        "miyarEmail"
    );

    localStorage.removeItem(
        "miyarEmployeeId"
    );

    localStorage.removeItem(
        "miyarEmployeeName"
    );

}


/* =========================================
   اختيار موظف
========================================= */

function selectEmployee() {

    selectedRole =
        "employee";


    employeeBtn.classList.add(
        "active"
    );


    adminBtn.classList.remove(
        "active"
    );


    employeeForm.classList.remove(
        "hidden"
    );


    adminForm.classList.add(
        "hidden"
    );


    loginDescription.textContent =
        "أدخل بريدك الإلكتروني لإرسال رمز التحقق";


    showEmployeeMessage("");


    showAdminMessage("");

}


/* =========================================
   اختيار مسؤول
========================================= */

function selectAdmin() {

    selectedRole =
        "admin";


    adminBtn.classList.add(
        "active"
    );


    employeeBtn.classList.remove(
        "active"
    );


    adminForm.classList.remove(
        "hidden"
    );


    employeeForm.classList.add(
        "hidden"
    );


    loginDescription.textContent =
        "أدخل بريد المسؤول وكلمة المرور";


    showEmployeeMessage("");


    showAdminMessage("");

}


/* =========================================
   التأكد أن البريد لموظف موجود
========================================= */

async function getEmployeeByEmail(email) {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("employees")
        .select(`
            id,
            name,
            email,
            employee_number,
            auth_user_id,
            employment_status
        `)
        .ilike(
            "email",
            email
        )
        .maybeSingle();


    if (error) {

        console.error(error);

        return {
            employee: null,
            error: true
        };

    }


    return {
        employee: data,
        error: false
    };

}


/* =========================================
   إرسال رمز الموظف
========================================= */

async function sendEmployeeCode() {

    showEmployeeMessage("");


    const email =
        employeeEmail
            .value
            .trim()
            .toLowerCase();


    if (!email) {

        showEmployeeMessage(
            "أدخل بريدك الإلكتروني"
        );

        return;

    }


    if (email === ADMIN_EMAIL) {

        showEmployeeMessage(
            "هذا البريد مخصص لحساب المسؤول"
        );

        return;

    }


    sendCodeBtn.disabled =
        true;


    sendCodeBtn.textContent =
        "جارٍ إرسال الرمز...";


    try {

        /*
            أولاً نتأكد أن البريد مسجل
            كموظف في نظام معيار.
        */

        const result =
            await getEmployeeByEmail(
                email
            );


        if (result.error) {

            showEmployeeMessage(
                "تعذر التحقق من بيانات الموظف"
            );

            return;

        }


        if (!result.employee) {

            showEmployeeMessage(
                "البريد الإلكتروني غير مسجل كموظف"
            );

            return;

        }


        /*
            Supabase Email OTP

            shouldCreateUser = true
            يسمح بإنشاء حساب Auth تلقائياً
            لأول مرة عند إرسال OTP.
        */

        const {
            error
        } =
        await supabaseClient
            .auth
            .signInWithOtp({

                email: email,

                options: {

                    shouldCreateUser:
                        true

                }

            });


        if (error) {

            console.error(error);

            showEmployeeMessage(
                "تعذر إرسال رمز التحقق"
            );

            return;

        }


        otpEmail =
            email;


        otpSection.classList.add(
            "show"
        );


        employeeEmail.readOnly =
            true;


        sendCodeBtn.style.display =
            "none";


        showEmployeeMessage(
            "تم إرسال رمز التحقق إلى بريدك الإلكتروني",
            true
        );


        setTimeout(
            function() {

                otpCode.focus();

            },
            150
        );

    }

    catch(error) {

        console.error(error);

        showEmployeeMessage(
            "حدث خطأ أثناء إرسال رمز التحقق"
        );

    }

    finally {

        sendCodeBtn.disabled =
            false;


        sendCodeBtn.textContent =
            "إرسال رمز التحقق";

    }

}


/* =========================================
   إعادة إرسال الرمز
========================================= */

async function resendEmployeeCode() {

    if (!otpEmail) {

        showEmployeeMessage(
            "أدخل بريدك الإلكتروني أولاً"
        );

        return;

    }


    resendCodeBtn.disabled =
        true;


    resendCodeBtn.textContent =
        "جارٍ إعادة الإرسال...";


    showEmployeeMessage("");


    try {

        const {
            error
        } =
        await supabaseClient
            .auth
            .signInWithOtp({

                email:
                    otpEmail,

                options: {

                    shouldCreateUser:
                        true

                }

            });


        if (error) {

            console.error(error);

            showEmployeeMessage(
                "تعذر إعادة إرسال الرمز"
            );

            return;

        }


        showEmployeeMessage(
            "تم إرسال رمز جديد إلى بريدك الإلكتروني",
            true
        );

    }

    catch(error) {

        console.error(error);

        showEmployeeMessage(
            "حدث خطأ أثناء إعادة إرسال الرمز"
        );

    }

    finally {

        resendCodeBtn.disabled =
            false;


        resendCodeBtn.textContent =
            "إعادة إرسال الرمز";

    }

}


/* =========================================
   التحقق من الرمز
========================================= */

async function verifyEmployeeCode() {

    showEmployeeMessage("");


    const token =
        otpCode
            .value
            .trim();


    if (!otpEmail) {

        showEmployeeMessage(
            "أرسل رمز التحقق أولاً"
        );

        return;

    }


    if (!token) {

        showEmployeeMessage(
            "أدخل رمز التحقق"
        );

        return;

    }


    if (!/^\d{6}$/.test(token)) {

        showEmployeeMessage(
            "رمز التحقق يجب أن يتكون من 6 أرقام"
        );

        return;

    }


    verifyCodeBtn.disabled =
        true;


    verifyCodeBtn.textContent =
        "جارٍ التحقق...";


    try {

        /*
            التحقق من OTP
        */

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .verifyOtp({

                email:
                    otpEmail,

                token:
                    token,

                type:
                    "email"

            });


        if (
            error ||
            !data.user
        ) {

            console.error(error);

            showEmployeeMessage(
                "رمز التحقق غير صحيح أو انتهت صلاحيته"
            );

            return;

        }


        /*
            نجيب ملف الموظف من employees
        */

        const employeeResult =
            await getEmployeeByEmail(
                otpEmail
            );


        if (
            employeeResult.error ||
            !employeeResult.employee
        ) {

            await supabaseClient
                .auth
                .signOut();


            showEmployeeMessage(
                "تعذر العثور على بيانات الموظف"
            );

            return;

        }


        const employee =
            employeeResult.employee;


        /*
            إذا كان أول دخول للموظف
            نربط Auth UID بملف الموظف.
        */

        if (!employee.auth_user_id) {

            const {
                error: updateError
            } =
            await supabaseClient
                .from("employees")
                .update({

                    auth_user_id:
                        data.user.id

                })
                .eq(
                    "id",
                    employee.id
                );


            if (updateError) {

                console.error(
                    updateError
                );

                await supabaseClient
                    .auth
                    .signOut();


                showEmployeeMessage(
                    "تم التحقق من البريد ولكن تعذر ربط حساب الموظف"
                );

                return;

            }

        }

        else if (
            String(employee.auth_user_id) !==
            String(data.user.id)
        ) {

            await supabaseClient
                .auth
                .signOut();


            showEmployeeMessage(
                "هذا البريد مرتبط بحساب آخر"
            );

            return;

        }


        /*
            حفظ بيانات الجلسة
        */

        clearLocalData();


        localStorage.setItem(
            "miyarRole",
            "employee"
        );


        localStorage.setItem(
            "miyarEmail",
            employee.email || otpEmail
        );


        localStorage.setItem(
            "miyarEmployeeId",
            String(employee.id)
        );


        localStorage.setItem(
            "miyarEmployeeName",
            employee.name || ""
        );


        showEmployeeMessage(
            "تم التحقق بنجاح",
            true
        );


        window.location.href =
            "employee-home.html";

    }

    catch(error) {

        console.error(error);

        showEmployeeMessage(
            "حدث خطأ أثناء التحقق من الرمز"
        );

    }

    finally {

        verifyCodeBtn.disabled =
            false;


        verifyCodeBtn.textContent =
            "تحقق ودخول";

    }

}


/* =========================================
   دخول المسؤول
========================================= */

async function loginAdmin() {

    showAdminMessage("");


    const email =
        adminEmail
            .value
            .trim()
            .toLowerCase();


    const password =
        adminPassword.value;


    if (
        !email ||
        !password
    ) {

        showAdminMessage(
            "أدخل البريد الإلكتروني وكلمة المرور"
        );

        return;

    }


    if (email !== ADMIN_EMAIL) {

        showAdminMessage(
            "هذا الحساب غير مصرح له بالدخول كمسؤول"
        );

        return;

    }


    adminLoginBtn.disabled =
        true;


    adminLoginBtn.textContent =
        "جارٍ تسجيل الدخول...";


    try {

        /*
            إنهاء أي جلسة موظف قديمة
        */

        await supabaseClient
            .auth
            .signOut();


        clearLocalData();


        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .signInWithPassword({

                email:
                    email,

                password:
                    password

            });


        if (
            error ||
            !data.user
        ) {

            console.error(error);

            showAdminMessage(
                "البريد الإلكتروني أو كلمة المرور غير صحيحة"
            );

            return;

        }


        const currentEmail =
            String(
                data.user.email || ""
            )
            .trim()
            .toLowerCase();


        if (
            currentEmail !==
            ADMIN_EMAIL
        ) {

            await supabaseClient
                .auth
                .signOut();


            showAdminMessage(
                "هذا الحساب غير مصرح له بالدخول كمسؤول"
            );

            return;

        }


        localStorage.setItem(
            "miyarRole",
            "admin"
        );


        localStorage.setItem(
            "miyarEmail",
            currentEmail
        );


        window.location.href =
            "dashboard.html";

    }

    catch(error) {

        console.error(error);

        showAdminMessage(
            "حدث خطأ أثناء تسجيل الدخول"
        );

    }

    finally {

        adminLoginBtn.disabled =
            false;


        adminLoginBtn.textContent =
            "تسجيل الدخول";

    }

}


/* =========================================
   الأحداث
========================================= */

employeeBtn.addEventListener(
    "click",
    selectEmployee
);


adminBtn.addEventListener(
    "click",
    selectAdmin
);


sendCodeBtn.addEventListener(
    "click",
    sendEmployeeCode
);


resendCodeBtn.addEventListener(
    "click",
    resendEmployeeCode
);


employeeForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        await verifyEmployeeCode();

    }
);


adminForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        await loginAdmin();

    }
);


/* =========================================
   السماح بالأرقام فقط في OTP
========================================= */

otpCode.addEventListener(
    "input",
    function() {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 6);

    }
);


/* =========================================
   البداية
========================================= */

selectEmployee();

</script>

</body>
</html>
