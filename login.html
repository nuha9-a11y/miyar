<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>معيار | تسجيل الدخول</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>

<main class="login-page">

    <header class="header">

        <img
            src="assets/logo.png"
            alt="معيار"
            class="logo"
        >

    </header>


    <section class="login-section">

        <div class="login-card">

            <div class="card-header">

                <h1>
                    تسجيل الدخول
                </h1>

                <p id="loginDescription">
                    أدخل بريدك الإلكتروني لإرسال رمز التحقق
                </p>

            </div>


            <!-- =====================================
                 نوع المستخدم
            ====================================== -->

            <div class="role-title">
                نوع المستخدم
            </div>


            <div class="role-options">

                <button
                    type="button"
                    class="role-btn active"
                    id="employeeBtn"
                >
                    <span class="radio-circle"></span>
                    موظف
                </button>


                <button
                    type="button"
                    class="role-btn"
                    id="adminBtn"
                >
                    <span class="radio-circle"></span>
                    مسؤول
                </button>

            </div>


            <!-- =====================================
                 الموظف
            ====================================== -->

            <form
                id="employeeForm"
                class="login-form"
            >

                <div class="input-group">

                    <label for="employeeEmail">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="employeeEmail"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    type="button"
                    class="login-btn"
                    id="sendCodeBtn"
                >
                    إرسال رمز التحقق
                </button>


                <!-- رمز تحقق الموظف -->

                <div
                    class="otp-section"
                    id="otpSection"
                >

                    <div class="otp-divider">

                        <span>
                            رمز التحقق
                        </span>

                    </div>


                    <div class="input-group otp-group">

                        <label for="otpCode">
                            أدخل الرمز المرسل إلى بريدك
                        </label>

                        <input
                            type="text"
                            id="otpCode"
                            class="otp-input"
                            placeholder="000000"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-btn"
                        id="verifyCodeBtn"
                    >
                        تحقق ودخول
                    </button>


                    <button
                        type="button"
                        class="resend-btn"
                        id="resendCodeBtn"
                    >
                        إعادة إرسال الرمز
                    </button>

                </div>


                <p
                    class="error-message"
                    id="employeeMessage"
                ></p>

            </form>


            <!-- =====================================
                 المسؤول / HR
            ====================================== -->

            <form
                id="adminForm"
                class="login-form hidden"
            >

                <div class="input-group">

                    <label for="adminEmail">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    type="button"
                    class="login-btn"
                    id="sendAdminCodeBtn"
                >
                    إرسال رمز التحقق
                </button>


                <!-- رمز تحقق المسؤول / HR -->

                <div
                    class="otp-section"
                    id="adminOtpSection"
                >

                    <div class="otp-divider">

                        <span>
                            رمز التحقق
                        </span>

                    </div>


                    <div class="input-group otp-group">

                        <label for="adminOtpCode">
                            أدخل الرمز المرسل إلى بريدك
                        </label>

                        <input
                            type="text"
                            id="adminOtpCode"
                            class="otp-input"
                            placeholder="000000"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-btn"
                        id="verifyAdminCodeBtn"
                    >
                        تحقق ودخول

                    <button
                        type="button"
                        class="resend-btn"
                        id="resendAdminCodeBtn"
                    >
                        إعادة إرسال الرمز
                    </button>

                <p
                    class="error-message"

            </form>

        </div>

    </section>

</main>

/* =========================================
   جلب الموظف بواسطة البريد
========================================= */

async function getEmployeeByEmail(email) {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("employees")
        .select(`
            id,
            name,
            email,
            employee_number,
            auth_user_id,
            employment_status
        `)
        .ilike(
            "email",
            email
        )
        .maybeSingle();


    if (error) {

        console.error(error);

        return {
            employee: null,
            error: true
        };

    }


    return {
        employee: data,
        error: false
    };

}


/* =========================================
   إرسال رمز الموظف
========================================= */

async function sendEmployeeCode() {

    showEmployeeMessage("");


    const email =
        employeeEmail
            .value
            .trim()
            .toLowerCase();


    if (!email) {

        showEmployeeMessage(
            "أدخل بريدك الإلكتروني"
        );

        return;

    }


    /*
        نمنع حسابات المسؤول و HR
        من الدخول من بوابة الموظف.
    */

    if (isAdminEmail(email)) {

        showEmployeeMessage(
            "هذا البريد مخصص لحساب المسؤول"
        );

        return;

    }


    sendCodeBtn.disabled =
        true;


    sendCodeBtn.textContent =
        "جارٍ إرسال الرمز...";


    try {

        /*
            نتأكد أولاً أن البريد
            موجود في جدول employees.
        */

        const result =
            await getEmployeeByEmail(
                email
            );


        if (result.error) {

            showEmployeeMessage(
                "تعذر التحقق من بيانات الموظف"
            );

            return;

        }


        if (!result.employee) {

            showEmployeeMessage(
                "البريد الإلكتروني غير مسجل كموظف"
            );

            return;

        }


        /*
            إرسال OTP للموظف
        */

        const {
            error
        } =
        await supabaseClient
            .auth
            .signInWithOtp({

                email: email,

                options: {

                    shouldCreateUser:
                        true

                }

            });


        if (error) {

            console.error(error);

            showEmployeeMessage(
                "تعذر إرسال رمز التحقق"
            );

            return;

        }


        otpEmail =
            email;


        otpSection.classList.add(
            "show"
        );


        employeeEmail.readOnly =
            true;


        sendCodeBtn.style.display =
            "none";


        showEmployeeMessage(
            "تم إرسال رمز التحقق إلى بريدك الإلكتروني",
            true
        );


        setTimeout(
            function() {

                otpCode.focus();

            },
            150
        );

    }

    catch(error) {

        console.error(error);

        showEmployeeMessage(
            "حدث خطأ أثناء إرسال رمز التحقق"
        );

    }

    finally {

        sendCodeBtn.disabled =
            false;


        sendCodeBtn.textContent =
            "إرسال رمز التحقق";

    }

}

/* =========================================
   التحقق من رمز الموظف
========================================= */

async function verifyEmployeeCode() {

    showEmployeeMessage("");


    const token =
        otpCode
            .value
            .trim();


    if (!otpEmail) {

        showEmployeeMessage(
            "أرسل رمز التحقق أولاً"
        );

        return;

    }


    if (!token) {

        showEmployeeMessage(
            "أدخل رمز التحقق"
        );

        return;

    }


    if (!/^\d{6}$/.test(token)) {

        showEmployeeMessage(
            "رمز التحقق يجب أن يتكون من 6 أرقام"
        );

        return;

    }


    verifyCodeBtn.disabled =
        true;


    verifyCodeBtn.textContent =
        "جارٍ التحقق...";


    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .verifyOtp({

                email:
                    otpEmail,

                token:
                    token,

                type:
                    "email"

            });


        if (
            error ||
            !data.user
        ) {

            console.error(error);

            showEmployeeMessage(
                "رمز التحقق غير صحيح أو انتهت صلاحيته"
            );

            return;

        }


        /*
            بعد نجاح OTP نتأكد مرة ثانية
            أن المستخدم ما زال موظفاً مسجلاً.
        */

        const employeeResult =
            await getEmployeeByEmail(
                otpEmail
            );


        if (
            employeeResult.error ||
            !employeeResult.employee
        ) {

            await supabaseClient
                .auth
                .signOut();


            showEmployeeMessage(
                "تعذر العثور على بيانات الموظف"
            );

            return;

        }


        const employee =
            employeeResult.employee;


        /*
            أول دخول:
            ربط auth_user_id ببيانات الموظف.
        */

        if (!employee.auth_user_id) {

            const {
                error: updateError
            } =
            await supabaseClient
                .from("employees")
                .update({

                    auth_user_id:
                        data.user.id

                })
                .eq(
                    "id",
                    employee.id
                );


            if (updateError) {

                console.error(
                    updateError
                );


                await supabaseClient
                    .auth
                    .signOut();


                showEmployeeMessage(
                    "تم التحقق من البريد ولكن تعذر ربط حساب الموظف"
                );

                return;

            }

        }

        else if (
            String(employee.auth_user_id) !==
            String(data.user.id)
        ) {

            await supabaseClient
                .auth
                .signOut();


            showEmployeeMessage(
                "هذا البريد مرتبط بحساب آخر"
            );

            return;

        }


        /*
            حفظ جلسة الموظف
        */

        clearLocalData();


        localStorage.setItem(
            "miyarRole",
            "employee"
        );


        localStorage.setItem(
            "miyarEmail",
            employee.email || otpEmail
        );


        localStorage.setItem(
            "miyarEmployeeId",
            String(employee.id)
        );


        localStorage.setItem(
            "miyarEmployeeName",
            employee.name || ""
        );


        showEmployeeMessage(
            "تم التحقق بنجاح",
            true
        );


        window.location.href =
            "employee-home.html";

    }

    catch(error) {

        console.error(error);

        showEmployeeMessage(
            "حدث خطأ أثناء التحقق من الرمز"
        );

    }

    finally {

        verifyCodeBtn.disabled =
            false;


        verifyCodeBtn.textContent =
            "تحقق ودخول";

    }

}

            حماية إضافية:
            البريد الذي أعاده Supabase نفسه
            يجب أن يكون من الحسابات الإدارية.
        */

        const currentEmail =
            String(
                data.user.email || ""
            )
            .trim()
            .toLowerCase();


        if (
            currentEmail !== adminOtpEmail ||
            !isAdminEmail(currentEmail)
        ) {

            await supabaseClient
                .auth
                .signOut();


            clearLocalData();


            showAdminMessage(
                "هذا الحساب غير مصرح له بالدخول كمسؤول"
            );

            return;

        }


        const account =
            ADMIN_ACCOUNTS[
                currentEmail
            ];


        /*
            حفظ الجلسة.

            نخزن miyarRole = admin للحسابين
            حتى صفحات المسؤول الحالية
            تستمر بالعمل بدون تغيير.

            ونحفظ النوع الحقيقي بشكل منفصل
            في miyarAdminType.
        */

        clearLocalData();


        localStorage.setItem(
            "miyarRole",
            "admin"
        );


        localStorage.setItem(
            "miyarEmail",
            currentEmail
        );


        localStorage.setItem(
            "miyarAdminType",
            account.role
        );


        localStorage.setItem(
            "miyarAdminName",
            account.name
        );


        showAdminMessage(
            account.role === "hr"
                ? "تم التحقق من حساب الموارد البشرية بنجاح"
                : "تم التحقق من حساب المسؤول بنجاح",
            true
        );


        window.location.href =
            "dashboard.html";

    }

    catch(error) {

        console.error(error);

        showAdminMessage(
            "حدث خطأ أثناء التحقق من الرمز"
        );

    }

    finally {

        verifyAdminCodeBtn.disabled =
            false;


        verifyAdminCodeBtn.textContent =
            "تحقق ودخول";

    }

}


/* =========================================
   الأحداث
========================================= */

employeeBtn.addEventListener(
    "click",
    selectEmployee
);

employeeForm.addEventListener(

adminForm.addEventListener(

        await verifyAdminCode();

    }
);

========================================= */

otpCode.addEventListener(
    "input",
    function() {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 6);

adminOtpCode.addEventListener(

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 6);

selectEmployee();
