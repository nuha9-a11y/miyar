<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>معيار | تسجيل الدخول</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<main class="login-page">


    <header class="header">

        <img
            src="assets/logo.png"
            alt="معيار"
            class="logo"
        >

    </header>



    <section class="login-section">


        <div class="login-card">


            <div class="card-header">

                <h1>
                    تسجيل الدخول
                </h1>

                <p id="loginDescription">
                    اختر نوع المستخدم ثم أدخل بياناتك
                </p>

            </div>



            <div class="role-title">
                نوع المستخدم
            </div>



            <div class="role-options">


                <button
                    type="button"
                    class="role-btn active"
                    id="employeeBtn"
                >

                    <span class="radio-circle"></span>

                    موظف

                </button>


                <button
                    type="button"
                    class="role-btn"
                    id="adminBtn"
                >

                    <span class="radio-circle"></span>

                    مسؤول

                </button>


            </div>



            <form id="loginForm">


                <div class="input-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        minlength="6"
                        required
                    >

                </div>



                <p
                    class="employee-note"
                    id="employeeNote"
                >
                    أول دخول؟ استخدم بريدك المسجل لدى الجهة واختر كلمة مرور لحسابك.
                </p>



                <p
                    class="error-message"
                    id="errorMessage"
                ></p>



                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    تسجيل الدخول
                </button>



                <button
                    type="button"
                    class="back-btn"
                    id="backButton"
                >
                    العودة إلى الصفحة الرئيسية
                </button>


            </form>


        </div>


    </section>


</main>



<script>


/* =========================================
   Supabase
========================================= */

const SUPABASE_URL =
    "https://avooyglxacytrfhvotsl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_NVlWEnA_w4KbSse_-70zdA_J9ut0Kyo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   الإعدادات
========================================= */

const ADMIN_EMAIL =
    "admin@gmail.com";


let selectedRole =
    "employee";



/* =========================================
   العناصر
========================================= */

const employeeBtn =
    document.getElementById(
        "employeeBtn"
    );


const adminBtn =
    document.getElementById(
        "adminBtn"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const employeeNote =
    document.getElementById(
        "employeeNote"
    );


const loginDescription =
    document.getElementById(
        "loginDescription"
    );



/* =========================================
   اختيار نوع المستخدم
========================================= */

function selectRole(role) {


    selectedRole =
        role;


    employeeBtn.classList.remove(
        "active"
    );


    adminBtn.classList.remove(
        "active"
    );


    clearMessage();


    if (
        role === "employee"
    ) {


        employeeBtn.classList.add(
            "active"
        );


        employeeNote.style.display =
            "block";


        loginDescription.textContent =
            "أدخل بريدك المسجل لدى الجهة وكلمة المرور";


    }


    else {


        adminBtn.classList.add(
            "active"
        );


        employeeNote.style.display =
            "none";


        loginDescription.textContent =
            "أدخل بيانات حساب المسؤول";


    }

}



/* =========================================
   الرسائل
========================================= */

function clearMessage() {


    errorMessage.textContent =
        "";


    errorMessage.classList.remove(
        "success-message"
    );

}



function showError(message) {


    errorMessage.classList.remove(
        "success-message"
    );


    errorMessage.textContent =
        message;

}



function showSuccess(message) {


    errorMessage.classList.add(
        "success-message"
    );


    errorMessage.textContent =
        message;

}



/* =========================================
   هل البريد تابع لموظف؟
========================================= */

async function employeeEmailExists(email) {


    const {
        data,
        error
    } =
    await supabaseClient
        .rpc(
            "check_employee_email",
            {
                input_email: email
            }
        );


    if (error) {


        console.error(
            "خطأ التحقق من بريد الموظف:",
            error
        );


        throw new Error(
            "تعذر التحقق من بريد الموظف"
        );

    }


    return data === true;

}



/* =========================================
   تحميل بيانات الموظف بعد الدخول
========================================= */

async function getEmployeeData(email) {


    const {
        data,
        error
    } =
    await supabaseClient
        .from("employees")
        .select(`
            id,
            name,
            email
        `)
        .ilike(
            "email",
            email
        )
        .maybeSingle();


    if (error) {


        console.error(
            "خطأ تحميل بيانات الموظف:",
            error
        );


        throw error;

    }


    return data;

}



/* =========================================
   تخزين الموظف
========================================= */

function saveEmployeeSession(employee) {


    localStorage.setItem(
        "miyarRole",
        "employee"
    );


    localStorage.setItem(
        "miyarEmail",
        employee.email
    );


    localStorage.setItem(
        "miyarEmployeeId",
        String(employee.id)
    );


    localStorage.setItem(
        "miyarEmployeeName",
        employee.name || ""
    );

}



/* =========================================
   دخول المسؤول
========================================= */

async function loginAdmin(
    email,
    password
) {


    if (
        email !==
        ADMIN_EMAIL
    ) {


        showError(
            "هذا الحساب غير مصرح له بالدخول كمسؤول"
        );


        return;

    }



    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .signInWithPassword({

            email: email,

            password: password

        });



    if (
        error
        ||
        !data.user
    ) {


        console.error(
            error
        );


        showError(
            "البريد الإلكتروني أو كلمة المرور غير صحيحة"
        );


        return;

    }



    localStorage.setItem(
        "miyarRole",
        "admin"
    );


    localStorage.setItem(
        "miyarEmail",
        email
    );


    localStorage.removeItem(
        "miyarEmployeeId"
    );


    localStorage.removeItem(
        "miyarEmployeeName"
    );


    window.location.href =
        "dashboard.html";

}



/* =========================================
   إكمال دخول الموظف
========================================= */

async function finishEmployeeLogin(email) {


    const employee =
        await getEmployeeData(
            email
        );


    if (!employee) {


        await supabaseClient
            .auth
            .signOut();


        showError(
            "تعذر العثور على بيانات الموظف"
        );


        return;

    }


    saveEmployeeSession(
        employee
    );


    window.location.href =
        "employee-home.html";

}



/* =========================================
   دخول الموظف
========================================= */

async function loginEmployee(
    email,
    password
) {


    /* -----------------------------------------
       التأكد أن البريد موجود في employees
    ----------------------------------------- */

    const exists =
        await employeeEmailExists(
            email
        );


    if (!exists) {


        showError(
            "هذا البريد غير مسجل ضمن الموظفين"
        );


        return;

    }



    if (
        email ===
        ADMIN_EMAIL
    ) {


        showError(
            "يرجى اختيار مسؤول للدخول بهذا الحساب"
        );


        return;

    }



    /* -----------------------------------------
       نحاول تسجيل الدخول أولاً
    ----------------------------------------- */

    const {
        data: loginData,
        error: loginError
    } =
    await supabaseClient
        .auth
        .signInWithPassword({

            email: email,

            password: password

        });



    /*
        إذا نجح:
        الموظف سبق أن أنشأ حسابه
    */

    if (
        !loginError
        &&
        loginData.user
    ) {


        await finishEmployeeLogin(
            email
        );


        return;

    }



    /* -----------------------------------------
       لم ينجح الدخول:
       نحاول إنشاء حساب لأول مرة
    ----------------------------------------- */

    const {
        data: signUpData,
        error: signUpError
    } =
    await supabaseClient
        .auth
        .signUp({

            email: email,

            password: password

        });



    if (signUpError) {


        console.error(
            "خطأ إنشاء حساب الموظف:",
            signUpError
        );


        const message =
            String(
                signUpError.message
                ||
                ""
            )
            .toLowerCase();



        if (
            message.includes("already")
            ||
            message.includes("registered")
            ||
            message.includes("exists")
        ) {


            showError(
                "الحساب موجود مسبقاً، تأكد من كلمة المرور"
            );


        }


        else if (
            message.includes("password")
        ) {


            showError(
                "كلمة المرور غير مقبولة، استخدم 6 أحرف أو أكثر"
            );


        }


        else {


            /*
                نعرض الخطأ الحقيقي في Console
                ونضع للمستخدم رسالة مفهومة
            */

            showError(
                "تعذر إنشاء الحساب. تحقق من البريد وكلمة المرور"
            );


        }


        return;

    }



    /*
        إذا أعطانا Supabase جلسة مباشرة
    */

    if (
        signUpData.session
        &&
        signUpData.user
    ) {


        await finishEmployeeLogin(
            email
        );


        return;

    }



    /*
        إذا كان تأكيد البريد مفعلاً
    */

    if (
        signUpData.user
        &&
        !signUpData.session
    ) {


        showSuccess(
            "تم إنشاء الحساب. تحقق من بريدك الإلكتروني ثم سجل الدخول."
        );


        return;

    }



    showError(
        "تعذر إنشاء حساب الموظف"
    );

}



/* =========================================
   إرسال النموذج
========================================= */

loginForm
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            clearMessage();



            const email =
                emailInput
                    .value
                    .trim()
                    .toLowerCase();



            const password =
                passwordInput
                    .value;



            if (
                !email
                ||
                !password
            ) {


                showError(
                    "يرجى إدخال البريد الإلكتروني وكلمة المرور"
                );


                return;

            }



            if (
                password.length < 6
            ) {


                showError(
                    "كلمة المرور يجب أن تكون 6 أحرف على الأقل"
                );


                return;

            }



            loginButton.disabled =
                true;


            loginButton.textContent =
                "جارٍ تسجيل الدخول...";



            try {


                if (
                    selectedRole === "admin"
                ) {


                    await loginAdmin(
                        email,
                        password
                    );


                }


                else {


                    await loginEmployee(
                        email,
                        password
                    );


                }


            }


            catch(error) {


                console.error(
                    "خطأ تسجيل الدخول:",
                    error
                );


                showError(
                    error.message
                    ||
                    "حدث خطأ أثناء تسجيل الدخول"
                );


            }


            finally {


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "تسجيل الدخول";


            }


        }
    );



/* =========================================
   الأزرار
========================================= */

employeeBtn
    .addEventListener(
        "click",
        function() {


            selectRole(
                "employee"
            );


        }
    );


adminBtn
    .addEventListener(
        "click",
        function() {


            selectRole(
                "admin"
            );


        }
    );



document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function() {


            window.location.href =
                "home.html";


        }
    );


</script>


</body>

</html>
