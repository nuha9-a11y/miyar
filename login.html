<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>معيار | تسجيل الدخول</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<main class="login-page">


    <header class="header">

        <img
            src="assets/logo.png"
            alt="معيار"
            class="logo"
        >

    </header>



    <section class="login-section">


        <div class="login-card">


            <div class="card-header">

                <h1>
                    تسجيل الدخول
                </h1>

                <p id="loginDescription">
                    أدخل بريدك المسجل والرقم الوظيفي
                </p>

            </div>



            <!-- نوع المستخدم -->

            <div class="role-title">
                نوع المستخدم
            </div>


            <div class="role-options">


                <button
                    type="button"
                    class="role-btn active"
                    id="employeeBtn"
                >

                    <span class="radio-circle"></span>

                    موظف

                </button>


                <button
                    type="button"
                    class="role-btn"
                    id="adminBtn"
                >

                    <span class="radio-circle"></span>

                    مسؤول

                </button>


            </div>



            <form id="loginForm">


                <!-- البريد -->

                <div class="input-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- كلمة المرور / الرقم الوظيفي -->

                <div class="input-group">

                    <label
                        for="loginSecret"
                        id="secretLabel"
                    >
                        الرقم الوظيفي
                    </label>

                    <input
                        type="text"
                        id="loginSecret"
                        placeholder="أدخل الرقم الوظيفي"
                        required
                    >

                </div>



                <!-- ملاحظة الموظف -->

                <p
                    class="employee-note"
                    id="employeeNote"
                >
                    استخدم البريد والرقم الوظيفي المسجلين لدى الجهة.
                </p>



                <!-- رسالة الخطأ -->

                <p
                    class="error-message"
                    id="errorMessage"
                ></p>



                <!-- الدخول -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    تسجيل الدخول
                </button>



                <!-- العودة -->

                <button
                    type="button"
                    class="back-btn"
                    id="backButton"
                >
                    العودة إلى الصفحة الرئيسية
                </button>


            </form>


        </div>


    </section>


</main>



<script>


/* =========================================
   Supabase
========================================= */

const SUPABASE_URL =
    "https://avooyglxacytrfhvotsl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_NVlWEnA_w4KbSse_-70zdA_J9ut0Kyo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   إعدادات المسؤول
========================================= */

const ADMIN_EMAIL =
    "admin@gmail.com";


let selectedRole =
    "employee";



/* =========================================
   العناصر
========================================= */

const employeeBtn =
    document.getElementById(
        "employeeBtn"
    );


const adminBtn =
    document.getElementById(
        "adminBtn"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const secretInput =
    document.getElementById(
        "loginSecret"
    );


const secretLabel =
    document.getElementById(
        "secretLabel"
    );


const employeeNote =
    document.getElementById(
        "employeeNote"
    );


const loginDescription =
    document.getElementById(
        "loginDescription"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );



/* =========================================
   اختيار نوع المستخدم
========================================= */

function selectRole(role) {


    selectedRole =
        role;


    employeeBtn.classList.remove(
        "active"
    );


    adminBtn.classList.remove(
        "active"
    );


    errorMessage.textContent =
        "";


    secretInput.value =
        "";


    if (
        role === "employee"
    ) {


        employeeBtn.classList.add(
            "active"
        );


        loginDescription.textContent =
            "أدخل بريدك المسجل والرقم الوظيفي";


        secretLabel.textContent =
            "الرقم الوظيفي";


        secretInput.type =
            "text";


        secretInput.placeholder =
            "أدخل الرقم الوظيفي";


        secretInput.removeAttribute(
            "minlength"
        );


        secretInput.setAttribute(
            "autocomplete",
            "off"
        );


        employeeNote.style.display =
            "block";


    }


    else {


        adminBtn.classList.add(
            "active"
        );


        loginDescription.textContent =
            "أدخل بيانات حساب المسؤول";


        secretLabel.textContent =
            "كلمة المرور";


        secretInput.type =
            "password";


        secretInput.placeholder =
            "أدخل كلمة المرور";


        secretInput.setAttribute(
            "minlength",
            "6"
        );


        secretInput.setAttribute(
            "autocomplete",
            "current-password"
        );


        employeeNote.style.display =
            "none";


    }

}



/* =========================================
   دخول الموظف
========================================= */

async function loginEmployee(
    email,
    employeeNumber
) {


    /*
        ما يحتاج الموظف حساب Authentication.
        فقط البريد + الرقم الوظيفي.
    */

    const {
        data,
        error
    } =
    await supabaseClient
        .rpc(
            "employee_login",
            {

                input_email:
                    email,

                input_employee_number:
                    employeeNumber

            }
        );



    if (error) {


        console.error(
            "خطأ دخول الموظف:",
            error
        );


        errorMessage.textContent =
            "تعذر التحقق من بيانات الموظف";


        return false;

    }



    /*
        الدالة ترجع Array
    */

    const employee =
        data
        &&
        data.length > 0
        ?
        data[0]
        :
        null;



    if (!employee) {


        errorMessage.textContent =
            "البريد الإلكتروني أو الرقم الوظيفي غير صحيح";


        return false;

    }



    /*
        نتأكد أن المسؤول لا يدخل كموظف
    */

    if (
        String(employee.email)
            .toLowerCase()
        ===
        ADMIN_EMAIL.toLowerCase()
    ) {


        errorMessage.textContent =
            "يرجى اختيار مسؤول للدخول بهذا الحساب";


        return false;

    }



    /*
        حفظ هوية الموظف
    */

    localStorage.setItem(
        "miyarRole",
        "employee"
    );


    localStorage.setItem(
        "miyarEmail",
        employee.email
    );


    localStorage.setItem(
        "miyarEmployeeId",
        String(employee.id)
    );


    localStorage.setItem(
        "miyarEmployeeName",
        employee.name || ""
    );



    /*
        الانتقال إلى الصفحة الرئيسية للموظف
    */

    window.location.href =
        "employee-home.html";


    return true;

}



/* =========================================
   دخول المسؤول
========================================= */

async function loginAdmin(
    email,
    password
) {


    /*
        المسؤول له البريد المحدد فقط
    */

    if (
        email !==
        ADMIN_EMAIL.toLowerCase()
    ) {


        errorMessage.textContent =
            "هذا الحساب غير مصرح له بالدخول كمسؤول";


        return false;

    }



    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .signInWithPassword({

            email:
                email,

            password:
                password

        });



    if (
        error
        ||
        !data.user
    ) {


        console.error(
            "خطأ دخول المسؤول:",
            error
        );


        errorMessage.textContent =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة";


        return false;

    }



    /*
        حفظ بيانات المسؤول
    */

    localStorage.setItem(
        "miyarRole",
        "admin"
    );


    localStorage.setItem(
        "miyarEmail",
        email
    );


    localStorage.removeItem(
        "miyarEmployeeId"
    );


    localStorage.removeItem(
        "miyarEmployeeName"
    );



    window.location.href =
        "dashboard.html";


    return true;

}



/* =========================================
   إرسال النموذج
========================================= */

loginForm
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();



            errorMessage.textContent =
                "";



            const email =
                emailInput
                    .value
                    .trim()
                    .toLowerCase();



            const secret =
                secretInput
                    .value
                    .trim();



            if (
                !email
                ||
                !secret
            ) {


                if (
                    selectedRole === "employee"
                ) {


                    errorMessage.textContent =
                        "يرجى إدخال البريد الإلكتروني والرقم الوظيفي";


                }


                else {


                    errorMessage.textContent =
                        "يرجى إدخال البريد الإلكتروني وكلمة المرور";


                }


                return;

            }



            /*
                مسؤول:
                كلمة المرور 6 أحرف على الأقل
            */

            if (
                selectedRole === "admin"
                &&
                secret.length < 6
            ) {


                errorMessage.textContent =
                    "كلمة المرور يجب أن تكون 6 أحرف على الأقل";


                return;

            }



            loginButton.disabled =
                true;


            loginButton.textContent =
                "جارٍ تسجيل الدخول...";



            try {


                if (
                    selectedRole === "employee"
                ) {


                    await loginEmployee(
                        email,
                        secret
                    );


                }


                else {


                    await loginAdmin(
                        email,
                        secret
                    );


                }


            }


            catch(error) {


                console.error(
                    "خطأ تسجيل الدخول:",
                    error
                );


                errorMessage.textContent =
                    "حدث خطأ أثناء تسجيل الدخول";


            }


            finally {


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "تسجيل الدخول";


            }


        }
    );



/* =========================================
   اختيار موظف
========================================= */

employeeBtn
    .addEventListener(
        "click",
        function() {


            selectRole(
                "employee"
            );


        }
    );



/* =========================================
   اختيار مسؤول
========================================= */

adminBtn
    .addEventListener(
        "click",
        function() {


            selectRole(
                "admin"
            );


        }
    );



/* =========================================
   العودة للرئيسية
========================================= */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function() {


            window.location.href =
                "home.html";


        }
    );



/* =========================================
   الحالة الافتراضية
========================================= */

selectRole(
    "employee"
);


</script>


</body>

</html>
