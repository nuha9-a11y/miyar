<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>معيار | تسجيل الدخول</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<main class="login-page">

    <!-- الشعار -->
    <header class="header">

        <img
            src="assets/logo.png"
            alt="معيار"
            class="logo"
        >

    </header>


    <!-- تسجيل الدخول -->
    <section class="login-section">

        <div class="login-card">

            <div class="card-header">

                <h1>
                    تسجيل الدخول
                </h1>

                <p>
                    اختر نوع المستخدم ثم أدخل بياناتك
                </p>

            </div>


            <!-- نوع المستخدم -->
            <div class="role-title">
                نوع المستخدم
            </div>


            <div class="role-options">

                <button
                    type="button"
                    class="role-btn active"
                    id="employeeBtn"
                    onclick="selectRole('employee')"
                >
                    <span class="radio-circle"></span>

                    موظف
                </button>


                <button
                    type="button"
                    class="role-btn"
                    id="adminBtn"
                    onclick="selectRole('admin')"
                >
                    <span class="radio-circle"></span>

                    مسؤول
                </button>

            </div>


            <form id="loginForm">

                <!-- البريد -->
                <div class="input-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <!-- كلمة المرور -->
                <div class="input-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        required
                    >

                </div>


                <!-- رسالة الخطأ -->
                <p
                    class="error-message"
                    id="errorMessage"
                ></p>


                <!-- تسجيل الدخول -->
                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    تسجيل الدخول
                </button>


                <!-- العودة -->
                <button
                    type="button"
                    class="back-btn"
                    onclick="goHome()"
                >
                    العودة إلى الصفحة الرئيسية
                </button>

            </form>

        </div>

    </section>

</main>


<script>

    /* =========================================
       بيانات Supabase
    ========================================= */

    const SUPABASE_URL =
        "https://avooyglxacytrfhvotsl.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_NVlWEnA_w4KbSse_-70zdA_J9ut0Kyo";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================================
       نوع المستخدم الافتراضي
    ========================================= */

    let selectedRole =
        "employee";


    /* =========================================
       بريد المسؤول
    ========================================= */

    const ADMIN_EMAIL =
        "admin@gmail.com";


    /* =========================================
       اختيار نوع المستخدم
    ========================================= */

    function selectRole(role) {

        selectedRole = role;


        const employeeBtn =
            document.getElementById(
                "employeeBtn"
            );


        const adminBtn =
            document.getElementById(
                "adminBtn"
            );


        employeeBtn.classList.remove(
            "active"
        );


        adminBtn.classList.remove(
            "active"
        );


        if (role === "employee") {

            employeeBtn.classList.add(
                "active"
            );

        } else {

            adminBtn.classList.add(
                "active"
            );

        }

    }


    /* =========================================
       تسجيل الدخول
    ========================================= */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const errorMessage =
                    document
                        .getElementById(
                            "errorMessage"
                        );


                const loginButton =
                    document
                        .getElementById(
                            "loginButton"
                        );


                /* تنظيف الرسالة */

                errorMessage.textContent =
                    "";


                /* التحقق من الحقول */

                if (
                    email === ""
                    ||
                    password === ""
                ) {

                    errorMessage.textContent =
                        "يرجى إدخال البريد الإلكتروني وكلمة المرور";

                    return;

                }


                /* تعطيل الزر أثناء الاتصال */

                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "جارٍ تسجيل الدخول...";


                try {


                    /* =================================
                       تسجيل الدخول من Supabase Auth
                    ================================= */

                    const {
                        data,
                        error
                    } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email: email,

                            password: password

                        });


                    /* خطأ تسجيل الدخول */

                    if (error) {

                        console.error(
                            error
                        );


                        errorMessage.textContent =
                            "البريد الإلكتروني أو كلمة المرور غير صحيحة";

                        return;

                    }


                    /* التأكد من وجود مستخدم */

                    if (!data.user) {

                        errorMessage.textContent =
                            "تعذر تسجيل الدخول";

                        return;

                    }


                    /* =================================
                       دخول المسؤول
                    ================================= */

                    if (
                        selectedRole === "admin"
                    ) {


                        /* التحقق من بريد المسؤول */

                        if (
                            email !==
                            ADMIN_EMAIL.toLowerCase()
                        ) {

                            await supabaseClient
                                .auth
                                .signOut();


                            errorMessage.textContent =
                                "هذا الحساب غير مصرح له بالدخول كمسؤول";

                            return;

                        }


                        /* تخزين بيانات الدخول */

                        localStorage.setItem(
                            "miyarRole",
                            "admin"
                        );


                        localStorage.setItem(
                            "miyarEmail",
                            email
                        );


                        localStorage.removeItem(
                            "miyarEmployeeId"
                        );


                        localStorage.removeItem(
                            "miyarEmployeeName"
                        );


                        /* الذهاب إلى لوحة التحكم */

                        window.location.href =
                            "dashboard.html";


                        return;

                    }


                    /* =================================
                       دخول الموظف
                    ================================= */

                    if (
                        selectedRole === "employee"
                    ) {


                        /* البحث عن الموظف في جدول employees */

                        const {
                            data: employee,
                            error: employeeError
                        } =
                        await supabaseClient
                            .from("employees")
                            .select(
                                "id, name, email"
                            )
                            .eq(
                                "email",
                                email
                            )
                            .maybeSingle();


                        /* مشكلة في قاعدة البيانات */

                        if (employeeError) {

                            console.error(
                                employeeError
                            );


                            await supabaseClient
                                .auth
                                .signOut();


                            errorMessage.textContent =
                                "تعذر التحقق من بيانات الموظف";

                            return;

                        }


                        /* الموظف غير موجود */

                        if (!employee) {

                            await supabaseClient
                                .auth
                                .signOut();


                            errorMessage.textContent =
                                "هذا الحساب غير مسجل كموظف";

                            return;

                        }


                        /* تخزين بيانات الموظف */

                        localStorage.setItem(
                            "miyarRole",
                            "employee"
                        );


                        localStorage.setItem(
                            "miyarEmail",
                            employee.email
                        );


                        localStorage.setItem(
                            "miyarEmployeeId",
                            employee.id
                        );


                        localStorage.setItem(
                            "miyarEmployeeName",
                            employee.name || ""
                        );


                        /* الذهاب إلى صفحة الموظف */

                        window.location.href =
                            "employee-home.html";


                        return;

                    }

                }

                catch (error) {

                    console.error(
                        error
                    );


                    errorMessage.textContent =
                        "حدث خطأ أثناء الاتصال بقاعدة البيانات";

                }

                finally {

                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "تسجيل الدخول";

                }

            }
        );


    /* =========================================
       العودة للرئيسية
    ========================================= */

    function goHome() {

        window.location.href =
            "home.html";

    }

</script>

</body>

</html>
