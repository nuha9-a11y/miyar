<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>معيار | تسجيل الدخول</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<main class="login-page">


    <!-- الشعار -->

    <header class="header">

        <img
            src="assets/logo.png"
            alt="معيار"
            class="logo"
        >

    </header>



    <!-- تسجيل الدخول -->

    <section class="login-section">


        <div class="login-card">


            <div class="card-header">

                <h1>
                    تسجيل الدخول
                </h1>

                <p id="loginDescription">
                    اختر نوع المستخدم ثم أدخل بياناتك
                </p>

            </div>



            <!-- نوع المستخدم -->

            <div class="role-title">
                نوع المستخدم
            </div>


            <div class="role-options">


                <button
                    type="button"
                    class="role-btn active"
                    id="employeeBtn"
                >

                    <span class="radio-circle"></span>

                    موظف

                </button>


                <button
                    type="button"
                    class="role-btn"
                    id="adminBtn"
                >

                    <span class="radio-circle"></span>

                    مسؤول

                </button>


            </div>



            <form id="loginForm">


                <!-- البريد -->

                <div class="input-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- كلمة المرور -->

                <div class="input-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        minlength="6"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- تنبيه الموظف -->

                <p
                    class="employee-note"
                    id="employeeNote"
                >
                    إذا كانت هذه أول مرة تدخل فيها، اكتب بريدك المسجل لدى الجهة واختر كلمة مرور لحسابك.
                </p>



                <!-- رسالة الخطأ / النجاح -->

                <p
                    class="error-message"
                    id="errorMessage"
                ></p>



                <!-- تسجيل الدخول -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    تسجيل الدخول
                </button>



                <!-- العودة -->

                <button
                    type="button"
                    class="back-btn"
                    id="backButton"
                >
                    العودة إلى الصفحة الرئيسية
                </button>


            </form>


        </div>


    </section>


</main>



<script>


/* =========================================
   Supabase
========================================= */

const SUPABASE_URL =
    "https://avooyglxacytrfhvotsl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_NVlWEnA_w4KbSse_-70zdA_J9ut0Kyo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   المسؤول
========================================= */

const ADMIN_EMAIL =
    "admin@gmail.com";



/* =========================================
   نوع المستخدم
========================================= */

let selectedRole =
    "employee";



/* =========================================
   العناصر
========================================= */

const employeeBtn =
    document.getElementById(
        "employeeBtn"
    );


const adminBtn =
    document.getElementById(
        "adminBtn"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const employeeNote =
    document.getElementById(
        "employeeNote"
    );


const loginDescription =
    document.getElementById(
        "loginDescription"
    );



/* =========================================
   اختيار الدور
========================================= */

function selectRole(role) {


    selectedRole =
        role;


    employeeBtn
        .classList
        .remove(
            "active"
        );


    adminBtn
        .classList
        .remove(
            "active"
        );


    errorMessage.textContent =
        "";


    if (
        role === "employee"
    ) {


        employeeBtn
            .classList
            .add(
                "active"
            );


        employeeNote.style.display =
            "block";


        loginDescription.textContent =
            "أدخل بريدك المسجل لدى الجهة وكلمة المرور";


    }


    else {


        adminBtn
            .classList
            .add(
                "active"
            );


        employeeNote.style.display =
            "none";


        loginDescription.textContent =
            "أدخل بيانات حساب المسؤول";


    }

}



/* =========================================
   البحث عن الموظف
========================================= */

async function findEmployee(
    email
) {


    const {
        data,
        error
    } =
    await supabaseClient
        .from("employees")
        .select(`
            id,
            name,
            email,
            status
        `)
        .ilike(
            "email",
            email
        )
        .maybeSingle();


    if (error) {


        console.error(
            "خطأ البحث عن الموظف:",
            error
        );


        throw new Error(
            "تعذر التحقق من بيانات الموظف"
        );

    }


    return data;

}



/* =========================================
   تخزين بيانات الموظف
========================================= */

function saveEmployeeSession(
    employee
) {


    localStorage.setItem(
        "miyarRole",
        "employee"
    );


    localStorage.setItem(
        "miyarEmail",
        employee.email
    );


    localStorage.setItem(
        "miyarEmployeeId",
        String(employee.id)
    );


    localStorage.setItem(
        "miyarEmployeeName",
        employee.name || ""
    );

}



/* =========================================
   دخول المسؤول
========================================= */

async function loginAdmin(
    email,
    password
) {


    if (
        email !==
        ADMIN_EMAIL.toLowerCase()
    ) {


        errorMessage.textContent =
            "هذا الحساب غير مصرح له بالدخول كمسؤول";


        return;

    }



    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .signInWithPassword({

            email:
                email,

            password:
                password

        });



    if (
        error
        ||
        !data.user
    ) {


        console.error(
            error
        );


        errorMessage.textContent =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة";


        return;

    }



    localStorage.setItem(
        "miyarRole",
        "admin"
    );


    localStorage.setItem(
        "miyarEmail",
        email
    );


    localStorage.removeItem(
        "miyarEmployeeId"
    );


    localStorage.removeItem(
        "miyarEmployeeName"
    );


    window.location.href =
        "dashboard.html";

}



/* =========================================
   دخول الموظف
========================================= */

async function loginEmployee(
    email,
    password
) {


    /*
        أول شيء:
        نتأكد أن البريد موجود أساساً
        داخل جدول employees
    */

    const employee =
        await findEmployee(
            email
        );



    if (!employee) {


        errorMessage.textContent =
            "هذا البريد غير مسجل ضمن الموظفين";


        return;

    }



    /*
        منع حساب المسؤول من استخدام
        واجهة الموظفين
    */

    if (
        email ===
        ADMIN_EMAIL.toLowerCase()
    ) {


        errorMessage.textContent =
            "يرجى اختيار مسؤول للدخول بهذا الحساب";


        return;

    }



    /*
        أولاً نحاول تسجيل الدخول.
        إذا كان للموظف حساب سابق
        سيدخل مباشرة.
    */

    const {
        data: loginData,
        error: loginError
    } =
    await supabaseClient
        .auth
        .signInWithPassword({

            email:
                email,

            password:
                password

        });



    /*
        الحساب موجود وكلمة المرور صحيحة
    */

    if (
        !loginError
        &&
        loginData.user
    ) {


        saveEmployeeSession(
            employee
        );


        window.location.href =
            "employee-home.html";


        return;

    }



    /*
        إذا فشل تسجيل الدخول،
        نحاول إنشاء الحساب.

        هذا يفيد الموظف في أول دخول له.
    */

    const {
        data: signUpData,
        error: signUpError
    } =
    await supabaseClient
        .auth
        .signUp({

            email:
                email,

            password:
                password

        });



    /*
        إذا كان الحساب موجود أصلاً
        فمعناه غالباً كلمة المرور المدخلة خطأ
    */

    if (signUpError) {


        console.error(
            "خطأ إنشاء الحساب:",
            signUpError
        );


        const message =
            String(
                signUpError.message
                ||
                ""
            )
            .toLowerCase();


        if (
            message.includes(
                "already"
            )
            ||
            message.includes(
                "registered"
            )
            ||
            message.includes(
                "exists"
            )
        ) {


            errorMessage.textContent =
                "كلمة المرور غير صحيحة";


        }


        else {


            errorMessage.textContent =
                "تعذر إنشاء حساب الموظف";


        }


        return;

    }



    /*
        بعض إعدادات Supabase
        تسمح بالدخول مباشرة بعد التسجيل
    */

    if (
        signUpData.session
        &&
        signUpData.user
    ) {


        saveEmployeeSession(
            employee
        );


        window.location.href =
            "employee-home.html";


        return;

    }



    /*
        إذا كان تأكيد البريد مفعلاً
    */

    if (
        signUpData.user
        &&
        !signUpData.session
    ) {


        errorMessage.textContent =
            "تم إنشاء حسابك. تحقق من بريدك الإلكتروني لتأكيد الحساب ثم سجل الدخول.";


        errorMessage.classList.add(
            "success-message"
        );


        return;

    }



    errorMessage.textContent =
        "تعذر تسجيل الدخول";


}



/* =========================================
   إرسال النموذج
========================================= */

loginForm
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const email =
                emailInput
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput
                    .value;



            errorMessage.textContent =
                "";


            errorMessage.classList.remove(
                "success-message"
            );



            if (
                !email
                ||
                !password
            ) {


                errorMessage.textContent =
                    "يرجى إدخال البريد الإلكتروني وكلمة المرور";


                return;

            }



            if (
                password.length < 6
            ) {


                errorMessage.textContent =
                    "كلمة المرور يجب أن تكون 6 أحرف على الأقل";


                return;

            }



            loginButton.disabled =
                true;


            loginButton.textContent =
                "جارٍ تسجيل الدخول...";



            try {


                if (
                    selectedRole ===
                    "admin"
                ) {


                    await loginAdmin(
                        email,
                        password
                    );


                }


                else {


                    await loginEmployee(
                        email,
                        password
                    );


                }


            }


            catch(error) {


                console.error(
                    "خطأ تسجيل الدخول:",
                    error
                );


                errorMessage.textContent =
                    error.message
                    ||
                    "حدث خطأ أثناء الاتصال بقاعدة البيانات";


            }


            finally {


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "تسجيل الدخول";


            }


        }
    );



/* =========================================
   أحداث اختيار الدور
========================================= */

employeeBtn
    .addEventListener(
        "click",
        function() {


            selectRole(
                "employee"
            );


        }
    );


adminBtn
    .addEventListener(
        "click",
        function() {


            selectRole(
                "admin"
            );


        }
    );



/* =========================================
   العودة للرئيسية
========================================= */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function() {


            window.location.href =
                "home.html";


        }
    );


</script>


</body>

</html>
