<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>معيار | المهام</title>

    <link rel="stylesheet" href="tasks.css">
</head>

<body>

<div class="tasks-page">

    <!-- هيدر الجوال -->
    <header class="mobile-header">

        <button
            class="mobile-menu-btn"
            id="mobileMenuBtn"
            type="button"
            aria-label="فتح القائمة"
        >
            ☰
        </button>

        <div class="mobile-header-title">
            <h2>المهام</h2>
            <span>معيار</span>
        </div>

        <img
            src="assets/logo.png"
            alt="معيار"
            class="mobile-logo"
        >

    </header>


    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- السايد بار -->
    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-logo">

            <img
                src="assets/logo.png"
                alt="معيار"
            >

        </div>


        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-link">
                لوحة التحكم
            </a>

            <a href="employees.html" class="nav-link">
                الموظفون
            </a>

            <a href="projects.html" class="nav-link">
                المشاريع
            </a>

            <a href="tasks.html" class="nav-link active">
                المهام
            </a>

            <a href="matching.html" class="nav-link">
                المطابقة والترشيح
            </a>

            <a href="evaluations.html" class="nav-link">
                التقييمات
            </a>

            <a href="decisions.html" class="nav-link">
                القرارات
            </a>

            <a href="reports.html" class="nav-link">
                التقارير
            </a>

        </nav>


        <button
            class="logout-btn"
            type="button"
            onclick="logout()"
        >
            تسجيل الخروج
        </button>

    </aside>


    <!-- المحتوى -->
    <main class="main-content">

        <header class="topbar">

            <span class="page-badge">
                إدارة المهام
            </span>

            <h1>
                المهام
            </h1>

            <p>
                إنشاء المهام وإسنادها ومتابعة حالتها
            </p>

        </header>


        <!-- الأدوات -->
        <section class="toolbar">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="ابحث باسم المهمة أو المشروع..."
                    oninput="filterTasks()"
                >

            </div>


            <div class="filters">

                <select
                    id="statusFilter"
                    onchange="filterTasks()"
                >

                    <option value="">
                        جميع الحالات
                    </option>

                    <option value="جديدة">
                        جديدة
                    </option>

                    <option value="قيد التنفيذ">
                        قيد التنفيذ
                    </option>

                    <option value="مكتملة">
                        مكتملة
                    </option>

                    <option value="متوقفة">
                        متوقفة
                    </option>

                </select>


                <select
                    id="priorityFilter"
                    onchange="filterTasks()"
                >

                    <option value="">
                        جميع الأولويات
                    </option>

                    <option value="عالية">
                        عالية
                    </option>

                    <option value="متوسطة">
                        متوسطة
                    </option>

                    <option value="منخفضة">
                        منخفضة
                    </option>

                </select>

            </div>


            <button
                class="add-btn"
                type="button"
                onclick="openTaskModal()"
            >
                + إضافة مهمة
            </button>

        </section>


        <!-- قائمة المهام -->
        <section class="tasks-container">

            <div class="section-title">

                <h2>
                    قائمة المهام
                </h2>

                <p>
                    عرض المهام ومتابعة حالتها
                </p>

            </div>


            <div
                class="tasks-grid"
                id="tasksGrid"
            >

                <div class="empty-state">
                    جاري التحميل...
                </div>

            </div>

        </section>

    </main>

</div>


<!-- نافذة إضافة / تعديل مهمة -->
<div
    class="modal"
    id="taskModal"
>

    <div
        class="modal-overlay"
        onclick="closeTaskModal()"
    ></div>


    <div class="modal-box">

        <div class="modal-header">

            <div>

                <h2 id="modalTitle">
                    إضافة مهمة
                </h2>

                <p>
                    أدخل بيانات المهمة
                </p>

            </div>


            <button
                class="close-btn"
                type="button"
                onclick="closeTaskModal()"
            >
                ×
            </button>

        </div>


        <form
            id="taskForm"
            onsubmit="saveTask(event)"
        >

            <input
                type="hidden"
                id="editTaskId"
            >


            <div class="form-grid">

                <!-- اسم المهمة -->
                <div class="form-group">

                    <label for="taskName">
                        اسم المهمة
                    </label>

                    <input
                        type="text"
                        id="taskName"
                        placeholder="اكتب اسم المهمة"
                        required
                    >

                </div>


                <!-- المشروع -->
                <div class="form-group">

                    <label for="taskProject">
                        المشروع المرتبط
                    </label>

                    <select
                        id="taskProject"
                        required
                    >

                        <option value="">
                            اختر المشروع
                        </option>

                    </select>

                </div>


                <!-- الأولوية -->
                <div class="form-group">

                    <label for="taskPriority">
                        الأولوية
                    </label>

                    <select id="taskPriority">

                        <option value="متوسطة">
                            متوسطة
                        </option>

                        <option value="عالية">
                            عالية
                        </option>

                        <option value="منخفضة">
                            منخفضة
                        </option>

                    </select>

                </div>


                <!-- الحالة -->
                <div class="form-group">

                    <label for="taskStatus">
                        حالة المهمة
                    </label>

                    <select id="taskStatus">

                        <option value="جديدة">
                            جديدة
                        </option>

                        <option value="قيد التنفيذ">
                            قيد التنفيذ
                        </option>

                        <option value="مكتملة">
                            مكتملة
                        </option>

                        <option value="متوقفة">
                            متوقفة
                        </option>

                    </select>

                </div>


                <!-- تاريخ الاستحقاق -->
                <div class="form-group">

                    <label for="taskDueDate">
                        تاريخ الاستحقاق
                    </label>

                    <input
                        type="date"
                        id="taskDueDate"
                    >

                </div>


                <!-- الموظف -->
                <div class="form-group">

                    <label for="assignedEmployee">
                        الموظف المسند إليه
                    </label>

                    <select id="assignedEmployee">

                        <option value="">
                            غير مسند
                        </option>

                    </select>

                </div>


                <!-- الوصف -->
                <div class="form-group full-width">

                    <label for="taskDescription">
                        وصف المهمة
                    </label>

                    <textarea
                        id="taskDescription"
                        placeholder="اكتب وصفاً واضحاً للمهمة"
                        required
                    ></textarea>

                </div>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeTaskModal()"
                >
                    إلغاء
                </button>


                <button
                    type="submit"
                    class="save-btn"
                    id="saveTaskBtn"
                >
                    حفظ المهمة
                </button>

            </div>

        </form>

    </div>

</div>


<!-- التفاصيل -->
<div
    class="modal"
    id="detailsModal"
>

    <div
        class="modal-overlay"
        onclick="closeDetailsModal()"
    ></div>


    <div class="modal-box details-box">

        <div class="modal-header">

            <div>

                <h2>
                    تفاصيل المهمة
                </h2>

                <p>
                    عرض بيانات المهمة
                </p>

            </div>


            <button
                class="close-btn"
                type="button"
                onclick="closeDetailsModal()"
            >
                ×
            </button>

        </div>


        <div
            id="taskDetails"
            class="details-grid"
        ></div>

    </div>

</div>


<script type="module">

import { supabase } from "./supabase.js";


/* ====================================
   حماية صفحة المسؤول
==================================== */

const role =
    localStorage.getItem("miyarRole");


if (role !== "admin") {

    alert(
        "غير مصرح لك بالدخول إلى صفحة المهام"
    );

    window.location.href =
        "login.html";

}


/* ====================================
   البيانات
==================================== */

let tasks = [];

let projects = [];

let employees = [];


/* ====================================
   السايد بار
==================================== */

const mobileMenuBtn =
    document.getElementById(
        "mobileMenuBtn"
    );


const sidebar =
    document.getElementById(
        "sidebar"
    );


const sidebarOverlay =
    document.getElementById(
        "sidebarOverlay"
    );


function openSidebar() {

    sidebar.classList.add(
        "show"
    );

    sidebarOverlay.classList.add(
        "show"
    );

    document.body.classList.add(
        "menu-open"
    );

}


function closeSidebar() {

    sidebar.classList.remove(
        "show"
    );

    sidebarOverlay.classList.remove(
        "show"
    );

    document.body.classList.remove(
        "menu-open"
    );

}


mobileMenuBtn.addEventListener(
    "click",
    openSidebar
);


sidebarOverlay.addEventListener(
    "click",
    closeSidebar
);


document
    .querySelectorAll(".nav-link")
    .forEach(function(link) {

        link.addEventListener(
            "click",
            closeSidebar
        );

    });


/* ====================================
   جلب المشاريع
==================================== */

async function loadProjects() {

    const {
        data,
        error
    } = await supabase
        .from("projects")
        .select(
            "id, project_name"
        )
        .order(
            "project_name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Projects:",
            error
        );

        return;

    }


    projects =
        data || [];


    const select =
        document.getElementById(
            "taskProject"
        );


    select.innerHTML = `

        <option value="">
            اختر المشروع
        </option>

    `;


    projects.forEach(
        function(project) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                project.id;


            option.textContent =
                project.project_name;


            select.appendChild(
                option
            );

        }
    );

}


/* ====================================
   جلب الموظفين
==================================== */

async function loadEmployees() {

    const {
        data,
        error
    } = await supabase
        .from("employees")
        .select(
            "id, name"
        )
        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Employees:",
            error
        );

        return;

    }


    employees =
        data || [];


    const select =
        document.getElementById(
            "assignedEmployee"
        );


    select.innerHTML = `

        <option value="">
            غير مسند
        </option>

    `;


    employees.forEach(
        function(employee) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                employee.id;


            option.textContent =
                employee.name;


            select.appendChild(
                option
            );

        }
    );

}


/* ====================================
   جلب المهام
==================================== */

async function loadTasks() {

    const grid =
        document.getElementById(
            "tasksGrid"
        );


    grid.innerHTML = `

        <div class="empty-state">
            جاري التحميل...
        </div>

    `;


    const {
        data,
        error
    } = await supabase
        .from("tasks")
        .select("*")
        .order(
            "id",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Tasks:",
            error
        );


        grid.innerHTML = `

            <div class="empty-state">
                تعذر تحميل المهام
            </div>

        `;

        return;

    }


    tasks =
        (data || [])
        .map(function(task) {

            const project =
                projects.find(
                    function(item) {

                        return (
                            Number(item.id)
                            ===
                            Number(task.project_id)
                        );

                    }
                );


            const employee =
                employees.find(
                    function(item) {

                        return (
                            Number(item.id)
                            ===
                            Number(
                                task.assigned_employee_id
                            )
                        );

                    }
                );


            return {

                id:
                    task.id,

                name:
                    task.task_name,

                projectId:
                    task.project_id,

                projectName:
                    project
                    ? project.project_name
                    : "غير محدد",

                priority:
                    task.priority
                    || "متوسطة",

                status:
                    task.status
                    || "جديدة",

                dueDate:
                    task.due_date,

                assignedEmployeeId:
                    task.assigned_employee_id,

                employeeName:
                    employee
                    ? employee.name
                    : "غير مسند",

                description:
                    task.description || ""

            };

        });


    renderTasks(
        tasks
    );

}


/* ====================================
   فتح إضافة مهمة
==================================== */

function openTaskModal() {

    document
        .getElementById(
            "taskForm"
        )
        .reset();


    document
        .getElementById(
            "editTaskId"
        )
        .value = "";


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        "إضافة مهمة";


    document
        .getElementById(
            "taskModal"
        )
        .classList.add(
            "show"
        );

}


/* ====================================
   إغلاق النوافذ
==================================== */

function closeTaskModal() {

    document
        .getElementById(
            "taskModal"
        )
        .classList.remove(
            "show"
        );

}


function closeDetailsModal() {

    document
        .getElementById(
            "detailsModal"
        )
        .classList.remove(
            "show"
        );

}


/* ====================================
   حفظ المهمة
==================================== */

async function saveTask(event) {

    event.preventDefault();


    const editId =
        document
            .getElementById(
                "editTaskId"
            )
            .value;


    const taskName =
        document
            .getElementById(
                "taskName"
            )
            .value
            .trim();


    const projectId =
        document
            .getElementById(
                "taskProject"
            )
            .value;


    const priority =
        document
            .getElementById(
                "taskPriority"
            )
            .value;


    const status =
        document
            .getElementById(
                "taskStatus"
            )
            .value;


    const dueDate =
        document
            .getElementById(
                "taskDueDate"
            )
            .value;


    const employeeId =
        document
            .getElementById(
                "assignedEmployee"
            )
            .value;


    const description =
        document
            .getElementById(
                "taskDescription"
            )
            .value
            .trim();


    if (!projectId) {

        alert(
            "يرجى اختيار المشروع"
        );

        return;

    }


    const taskData = {

        project_id:
            Number(projectId),

        task_name:
            taskName,

        description:
            description,

        priority:
            priority,

        due_date:
            dueDate || null,

        status:
            status,

        assigned_employee_id:
            employeeId
            ? Number(employeeId)
            : null

    };


    const saveButton =
        document.getElementById(
            "saveTaskBtn"
        );


    saveButton.disabled =
        true;


    saveButton.textContent =
        "جارٍ الحفظ...";


    try {


        if (editId) {

            const {
                error
            } = await supabase
                .from("tasks")
                .update(
                    taskData
                )
                .eq(
                    "id",
                    Number(editId)
                );


            if (error) {

                console.error(
                    error
                );

                alert(
                    "تعذر تعديل المهمة"
                );

                return;

            }


            alert(
                "تم تعديل المهمة بنجاح"
            );

        }

        else {

            const {
                error
            } = await supabase
                .from("tasks")
                .insert([
                    taskData
                ]);


            if (error) {

                console.error(
                    error
                );

                alert(
                    "تعذر إضافة المهمة"
                );

                return;

            }


            alert(
                "تمت إضافة المهمة بنجاح"
            );

        }


        closeTaskModal();


        await loadTasks();

    }

    finally {

        saveButton.disabled =
            false;


        saveButton.textContent =
            "حفظ المهمة";

    }

}


/* ====================================
   عرض المهام
==================================== */

function renderTasks(list) {

    const grid =
        document.getElementById(
            "tasksGrid"
        );


    grid.innerHTML =
        "";


    if (list.length === 0) {

        grid.innerHTML = `

            <div class="empty-state">
                لا توجد مهام حالياً
            </div>

        `;

        return;

    }


    list.forEach(
        function(task) {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "task-card";


            card.innerHTML = `

                <div class="task-card-top">

                    <div>

                        <span class="task-label">
                            ${escapeHtml(task.projectName)}
                        </span>

                        <h3>
                            ${escapeHtml(task.name)}
                        </h3>

                    </div>


                    <span class="
                        priority-badge
                        ${getPriorityClass(task.priority)}
                    ">
                        ${escapeHtml(task.priority)}
                    </span>

                </div>


                <p class="task-description">

                    ${
                        escapeHtml(
                            task.description
                            ||
                            "لا يوجد وصف"
                        )
                    }

                </p>


                <div class="task-info">

                    <div class="info-item">

                        <span>
                            الحالة
                        </span>

                        <strong>
                            ${escapeHtml(task.status)}
                        </strong>

                    </div>


                    <div class="info-item">

                        <span>
                            الموظف
                        </span>

                        <strong>
                            ${escapeHtml(task.employeeName)}
                        </strong>

                    </div>


                    <div class="info-item">

                        <span>
                            تاريخ الاستحقاق
                        </span>

                        <strong>
                            ${task.dueDate || "غير محدد"}
                        </strong>

                    </div>


                    <div class="info-item">

                        <span>
                            الأولوية
                        </span>

                        <strong>
                            ${escapeHtml(task.priority)}
                        </strong>

                    </div>

                </div>


                <div class="task-actions">

                    <button
                        type="button"
                        class="view-btn"
                        onclick="viewTask(${task.id})"
                    >
                        عرض
                    </button>


                    <button
                        type="button"
                        class="edit-btn"
                        onclick="editTask(${task.id})"
                    >
                        تعديل
                    </button>


                    <button
                        type="button"
                        class="matching-btn"
                        onclick="requestMatching(${task.id})"
                    >
                        طلب مطابقة
                    </button>


                    <button
                        type="button"
                        class="delete-btn"
                        onclick="deleteTask(${task.id})"
                    >
                        حذف
                    </button>

                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* ====================================
   الأولوية
==================================== */

function getPriorityClass(priority) {

    if (
        priority === "عالية"
    ) {

        return "high";

    }


    if (
        priority === "منخفضة"
    ) {

        return "low";

    }


    return "medium";

}


/* ====================================
   تعديل مهمة
==================================== */

function editTask(id) {

    const task =
        tasks.find(
            function(item) {

                return (
                    Number(item.id)
                    ===
                    Number(id)
                );

            }
        );


    if (!task) {

        return;

    }


    document
        .getElementById(
            "editTaskId"
        )
        .value =
        task.id;


    document
        .getElementById(
            "taskName"
        )
        .value =
        task.name;


    document
        .getElementById(
            "taskProject"
        )
        .value =
        task.projectId;


    document
        .getElementById(
            "taskPriority"
        )
        .value =
        task.priority;


    document
        .getElementById(
            "taskStatus"
        )
        .value =
        task.status;


    document
        .getElementById(
            "taskDueDate"
        )
        .value =
        task.dueDate || "";


    document
        .getElementById(
            "assignedEmployee"
        )
        .value =
        task.assignedEmployeeId
        || "";


    document
        .getElementById(
            "taskDescription"
        )
        .value =
        task.description;


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
        "تعديل المهمة";


    document
        .getElementById(
            "taskModal"
        )
        .classList.add(
            "show"
        );

}


/* ====================================
   حذف مهمة
==================================== */

async function deleteTask(id) {

    const confirmed =
        confirm(
            "هل تريد حذف هذه المهمة؟"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } = await supabase
        .from("tasks")
        .delete()
        .eq(
            "id",
            Number(id)
        );


    if (error) {

        console.error(
            error
        );

        alert(
            "تعذر حذف المهمة"
        );

        return;

    }


    alert(
        "تم حذف المهمة بنجاح"
    );


    await loadTasks();

}


/* ====================================
   تفاصيل المهمة
==================================== */

function viewTask(id) {

    const task =
        tasks.find(
            function(item) {

                return (
                    Number(item.id)
                    ===
                    Number(id)
                );

            }
        );


    if (!task) {

        return;

    }


    document
        .getElementById(
            "taskDetails"
        )
        .innerHTML = `

            <div class="detail-item">

                <span>
                    اسم المهمة
                </span>

                <strong>
                    ${escapeHtml(task.name)}
                </strong>

            </div>


            <div class="detail-item">

                <span>
                    المشروع
                </span>

                <strong>
                    ${escapeHtml(task.projectName)}
                </strong>

            </div>


            <div class="detail-item">

                <span>
                    الأولوية
                </span>

                <strong>
                    ${escapeHtml(task.priority)}
                </strong>

            </div>


            <div class="detail-item">

                <span>
                    الحالة
                </span>

                <strong>
                    ${escapeHtml(task.status)}
                </strong>

            </div>


            <div class="detail-item">

                <span>
                    تاريخ الاستحقاق
                </span>

                <strong>
                    ${task.dueDate || "غير محدد"}
                </strong>

            </div>


            <div class="detail-item">

                <span>
                    الموظف المسند إليه
                </span>

                <strong>
                    ${escapeHtml(task.employeeName)}
                </strong>

            </div>


            <div class="
                detail-item
                full-detail
            ">

                <span>
                    وصف المهمة
                </span>

                <strong>
                    ${
                        escapeHtml(
                            task.description
                            ||
                            "لا يوجد وصف"
                        )
                    }
                </strong>

            </div>

        `;


    document
        .getElementById(
            "detailsModal"
        )
        .classList.add(
            "show"
        );

}


/* ====================================
   طلب المطابقة
==================================== */

function requestMatching(id) {

    localStorage.setItem(
        "selectedTaskId",
        id
    );


    window.location.href =
        "matching.html";

}


/* ====================================
   البحث والتصفية
==================================== */

function filterTasks() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const status =
        document
            .getElementById(
                "statusFilter"
            )
            .value;


    const priority =
        document
            .getElementById(
                "priorityFilter"
            )
            .value;


    const filtered =
        tasks.filter(
            function(task) {

                const name =
                    (
                        task.name
                        ||
                        ""
                    )
                    .toLowerCase();


                const project =
                    (
                        task.projectName
                        ||
                        ""
                    )
                    .toLowerCase();


                const matchSearch =

                    name.includes(search)

                    ||

                    project.includes(search);


                const matchStatus =

                    !status

                    ||

                    task.status
                    ===
                    status;


                const matchPriority =

                    !priority

                    ||

                    task.priority
                    ===
                    priority;


                return (
                    matchSearch
                    &&
                    matchStatus
                    &&
                    matchPriority
                );

            }
        );


    renderTasks(
        filtered
    );

}


/* ====================================
   حماية النصوص
==================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* ====================================
   تسجيل الخروج
==================================== */

async function logout() {

    await supabase.auth.signOut();


    localStorage.removeItem(
        "miyarRole"
    );


    localStorage.removeItem(
        "miyarEmail"
    );


    window.location.href =
        "login.html";

}

   ربط الدوال بالأزرار
==================================== */

window.openTaskModal =

window.closeTaskModal =
    closeTaskModal;

window.closeDetailsModal =
    closeDetailsModal;

window.saveTask =
    saveTask;

window.editTask =
    editTask;

window.deleteTask =
    deleteTask;

window.viewTask =
    viewTask;

window.requestMatching =
    requestMatching;

window.filterTasks =
    filterTasks;

window.logout =

/* ====================================
   تشغيل الصفحة
==================================== */

async function startPage() {

    await loadProjects();

    await loadEmployees();

    await loadTasks();

}


startPage();
