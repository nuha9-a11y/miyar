<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>معيار | لوحة التحكم</title>

    <link
        rel="stylesheet"
        href="dashboard.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<div class="dashboard-page">


    <!-- ======================================
         هيدر الجوال
    ======================================= -->

    <header class="mobile-header">

        <button
            class="mobile-menu-btn"
            id="mobileMenuBtn"
            type="button"
            aria-label="فتح القائمة"

            ☰

        <div class="mobile-header-title">

            <h2>
                لوحة التحكم
            </h2>

            <span>
                معيار
            </span>

        </div>


        <img
            src="assets/logo.png"
            alt="معيار"
            class="mobile-logo"
        >

    </header>



    <!-- خلفية القائمة في الجوال -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>



    <!-- ======================================
         القائمة الجانبية
    ======================================= -->

    <aside
        class="sidebar"
        id="sidebar"
    >


        <div class="sidebar-logo">

            <img
                src="assets/logo.png"
                alt="معيار"
            >

        </div>



        <nav class="sidebar-nav">


            <a
                href="dashboard.html"
                class="nav-link active"
            >
                لوحة التحكم
            </a>


            <a
                href="employees.html"
                class="nav-link"
            >
                الموظفون
            </a>


            <a
                href="projects.html"
                class="nav-link"
            >
                المشاريع
            </a>


            <a
                href="tasks.html"
                class="nav-link"
            >
                المهام
            </a>


            <a
                href="matching.html"
                class="nav-link"
            >
                المطابقة والترشيح
            </a>


            <a
                href="evaluations.html"
                class="nav-link"
            >
                التقييمات
            </a>


            <a
                href="decisions.html"
                class="nav-link"
            >
                القرارات
            </a>


            <a
                href="reports.html"
                class="nav-link"
            >
                التقارير
            </a>


        </nav>



        <button
            class="logout-btn"
            type="button"
            id="logoutBtn"
        >
            تسجيل الخروج
        </button>


    </aside>



    <!-- ======================================
         المحتوى الرئيسي
    ======================================= -->

    <main class="main-content">


        <!-- رأس الصفحة -->

        <header class="topbar">

            <span class="page-badge">
                لوحة المسؤول
            </span>


            <h1>
                لوحة التحكم
            </h1>


            <p>
                عرض ملخص عام لأهم بيانات النظام
            </p>

        </header>



        <!-- ======================================
             ملخص النظام
        ======================================= -->

        <section class="summary-section">


            <div class="section-heading">

                <h2>
                    ملخص النظام
                </h2>

                <p>
                    نظرة عامة على الموظفين والمشاريع والمهام
                </p>

            </div>



            <div class="summary-grid">


                <button
                    class="summary-card"
                    type="button"
                    onclick="goToPage('employees.html')"
                >

                    <span>
                        عدد الموظفين
                    </span>

                    <strong id="employeesCount">
                        0
                    </strong>

                    <small>
                        عرض الموظفين
                    </small>

                </button>



                <button
                    class="summary-card"
                    type="button"
                    onclick="goToPage('projects.html')"
                >

                    <span>
                        عدد المشاريع
                    </span>

                    <strong id="projectsCount">
                        0
                    </strong>

                    <small>
                        عرض المشاريع
                    </small>

                </button>



                <button
                    class="summary-card"
                    type="button"
                    onclick="goToPage('tasks.html')"
                >

                    <span>
                        عدد المهام
                    </span>

                    <strong id="tasksCount">
                        0
                    </strong>

                    <small>
                        عرض المهام
                    </small>

                </button>



                <button
                    class="summary-card"
                    type="button"
                    onclick="goToPage('employees.html')"
                >

                    <span>
                        موظفون متاحون
                    </span>

                    <strong id="availableCount">
                        0
                    </strong>

                    <small>
                        عرض الموظفين
                    </small>

                </button>



                <button
                    class="summary-card"
                    type="button"
                    onclick="goToPage('employees.html')"
                >

                    <span>
                        موظفون مشغولون
                    </span>

                    <strong id="busyCount">
                        0
                    </strong>

                    <small>
                        عرض الموظفين
                    </small>

                </button>



                <button
                    class="summary-card"
                    type="button"
                    onclick="goToPage('tasks.html')"
                >

                    <span>
                        مهام غير مسندة
                    </span>

                    <strong id="unassignedCount">
                        0
                    </strong>

                    <small>
                        عرض المهام
                    </small>

                </button>


            </div>


        </section>



        <!-- ======================================
             آخر النشاطات
        ======================================= -->

        <section class="activity-section">


            <div class="activity-grid">


                <!-- آخر الترشيحات -->

                <article class="activity-card">


                    <div class="activity-header">


                        <div>

                            <h3>
                                آخر الترشيحات
                            </h3>

                            <button
                                type="button"
                                class="activity-link"
                                onclick="goToPage('matching.html')"
                            >
                                عرض المطابقة والترشيح
                            </button>

                        </div>


                        <button
                            class="arrow-btn"
                            type="button"
                            onclick="goToPage('matching.html')"
                            aria-label="عرض المطابقة والترشيح"
                        >
                            ←
                        </button>


                    </div>



                    <div
                        class="activity-list"
                        id="matchingActivity"
                    >

                        <div class="empty-state">
                            جارٍ تحميل الترشيحات...
                        </div>

                    </div>


                </article>



                <!-- آخر القرارات -->

                <article class="activity-card">


                    <div class="activity-header">


                        <div>

                            <h3>
                                آخر القرارات
                            </h3>

                            <button
                                type="button"
                                class="activity-link"
                                onclick="goToPage('decisions.html')"
                            >
                                عرض القرارات
                            </button>

                        </div>


                        <button
                            class="arrow-btn"
                            type="button"
                            onclick="goToPage('decisions.html')"
                            aria-label="عرض القرارات"
                        >
                            ←
                        </button>


                    </div>



                    <div
                        class="activity-list"
                        id="decisionsActivity"
                    >

                        <div class="empty-state">
                            جارٍ تحميل القرارات...
                        </div>

                    </div>


                </article>


            </div>


        </section>


    </main>


</div>



<script>


/* ==========================================
   إعداد Supabase
========================================== */

const SUPABASE_URL =
    "https://avooyglxacytrfhvotsl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_NVlWEnA_w4KbSse_-70zdA_J9ut0Kyo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* ==========================================
   بريد المسؤول
========================================== */

const ADMIN_EMAIL =
    "admin@gmail.com";



/* ==========================================
   البيانات
========================================== */

let employeesList = [];

let projectsList = [];

let tasksList = [];

let decisionsList = [];



/* ==========================================
   حماية صفحة المسؤول
========================================== */

async function protectAdminPage() {


    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();



    if (
        error
        ||
        !data.session
    ) {


        clearSession();


        window.location.href =
            "login.html";


        return false;

    }



    const userEmail =
        String(
            data.session.user.email
            ||
            ""
        )
        .trim()
        .toLowerCase();



    if (
        userEmail !==
        ADMIN_EMAIL.toLowerCase()
    ) {


        await supabaseClient
            .auth
            .signOut();


        clearSession();


        window.location.href =
            "login.html";


        return false;

    }



    localStorage.setItem(
        "miyarRole",
        "admin"
    );


    localStorage.setItem(
        "miyarEmail",
        userEmail
    );


    return true;

}



/* ==========================================
   تحميل الموظفين
========================================== */

async function loadEmployees() {


    const {
        data,
        error
    } =
    await supabaseClient
        .from("employees")
        .select(`
            id,
            name,
            email,
            status
        `)
        .order(
            "id",
            {
                ascending: false
            }
        );



    if (error) {


        console.error(
            "خطأ تحميل الموظفين:",
            error
        );


        employeesList =
            [];


        return;

    }



    employeesList =
        data || [];



    document
        .getElementById(
            "employeesCount"
        )
        .textContent =
        employeesList.length;



    let available =
        0;


    let busy =
        0;



    employeesList.forEach(
        function(employee) {


            const status =
                normalizeText(
                    employee.status
                );



            if (
                status === "متاح"
                ||
                status === "available"
            ) {

                available++;

            }



            if (
                status === "مشغول"
                ||
                status === "busy"
            ) {

                busy++;

            }


        }
    );



    document
        .getElementById(
            "availableCount"
        )
        .textContent =
        available;



    document
        .getElementById(
            "busyCount"
        )
        .textContent =
        busy;

}



/* ==========================================
   تحميل المشاريع
========================================== */

async function loadProjects() {


    const {
        data,
        error
    } =
    await supabaseClient
        .from("projects")
        .select(`
            id,
            project_name,
            status
        `)
        .order(
            "id",
            {
                ascending: false
            }
        );



    if (error) {


        console.error(
            "خطأ تحميل المشاريع:",
            error
        );


        projectsList =
            [];


        return;

    }



    projectsList =
        data || [];



    document
        .getElementById(
            "projectsCount"
        )
        .textContent =
        projectsList.length;

}



/* ==========================================
   تحميل المهام
========================================== */

async function loadTasks() {


    const {
        data,
        error
    } =
    await supabaseClient
        .from("tasks")
        .select(`
            id,
            project_id,
            task_name,
            status,
            assigned_employee_id
        `)
        .order(
            "id",
            {
                ascending: false
            }
        );



    if (error) {


        console.error(
            "خطأ تحميل المهام:",
            error
        );


        tasksList =
            [];


        return;

    }



    tasksList =
        data || [];



    document
        .getElementById(
            "tasksCount"
        )
        .textContent =
        tasksList.length;



    const unassignedTasks =
        tasksList.filter(
            function(task) {


                return (

                    task.assigned_employee_id === null

                    ||

                    task.assigned_employee_id === undefined

                    ||

                    task.assigned_employee_id === ""

                );


            }
        );



    document
        .getElementById(
            "unassignedCount"
        )
        .textContent =
        unassignedTasks.length;

}



/* ==========================================
   تحميل القرارات والترشيحات
========================================== */

async function loadDecisions() {


    const {
        data,
        error
    } =
    await supabaseClient
        .from("decisions")
        .select(`
            id,
            task_id,
            system_candidate_id,
            selected_employee_id,
            match_rate,
            reason,
            decision_date,
            created_at
        `)
        .order(
            "created_at",
            {
                ascending: false
            }
        )
        .limit(10);



    if (error) {


        console.error(
            "خطأ تحميل القرارات:",
            error
        );


        decisionsList =
            [];


        renderMatchingActivity();


        renderDecisionsActivity();


        return;

    }



    decisionsList =
        data || [];



    renderMatchingActivity();


    renderDecisionsActivity();

}



/* ==========================================
   الحصول على اسم الموظف
========================================== */

function getEmployeeName(
    employeeId
) {


    if (
        employeeId === null
        ||
        employeeId === undefined
    ) {


        return "غير محدد";

    }



    const employee =
        employeesList.find(
            function(item) {


                return (

                    Number(item.id)
                    ===
                    Number(employeeId)

                );


            }
        );



    if (!employee) {


        return "موظف غير معروف";

    }



    return (
        employee.name
        ||
        "موظف غير معروف"
    );

}



/* ==========================================
   الحصول على اسم المهمة
========================================== */

function getTaskName(
    taskId
) {


    if (
        taskId === null
        ||
        taskId === undefined
    ) {


        return "مهمة غير محددة";

    }



    const task =
        tasksList.find(
            function(item) {


                return (

                    Number(item.id)
                    ===
                    Number(taskId)

                );


            }
        );



    if (!task) {


        return "مهمة غير معروفة";

    }



    return (
        task.task_name
        ||
        "مهمة بدون اسم"
    );

}



/* ==========================================
   آخر الترشيحات
========================================== */

function renderMatchingActivity() {


    const container =
        document.getElementById(
            "matchingActivity"
        );



    container.innerHTML =
        "";



    const nominations =
        decisionsList.filter(
            function(decision) {


                return (

                    decision.system_candidate_id
                    !== null

                    &&

                    decision.system_candidate_id
                    !== undefined

                );


            }
        );



    if (
        nominations.length === 0
    ) {


        container.innerHTML = `

            <div class="empty-state">

                لا توجد ترشيحات حالياً

            </div>

        `;


        return;

    }



    nominations
        .slice(
            0,
            3
        )
        .forEach(
            function(decision) {


                const employeeName =
                    getEmployeeName(
                        decision.system_candidate_id
                    );


                const taskName =
                    getTaskName(
                        decision.task_id
                    );


                const matchRate =
                    decision.match_rate
                    ??
                    0;



                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "dashboard-activity-row";



                row.innerHTML = `

                    <div class="activity-main">

                        <strong>
                            ${
                                escapeHtml(
                                    employeeName
                                )
                            }
                        </strong>

                        <span>
                            ${
                                escapeHtml(
                                    taskName
                                )
                            }
                        </span>

                    </div>


                    <div class="activity-value">

                        ${
                            escapeHtml(
                                matchRate
                            )
                        }%

                    </div>

                `;



                container.appendChild(
                    row
                );


            }
        );

}



/* ==========================================
   آخر القرارات
========================================== */

function renderDecisionsActivity() {


    const container =
        document.getElementById(
            "decisionsActivity"
        );



    container.innerHTML =
        "";



    if (
        decisionsList.length === 0
    ) {


        container.innerHTML = `

            <div class="empty-state">

                لا توجد قرارات حالياً

            </div>

        `;


        return;

    }



    decisionsList
        .slice(
            0,
            3
        )
        .forEach(
            function(decision) {


                const taskName =
                    getTaskName(
                        decision.task_id
                    );


                const employeeName =
                    getEmployeeName(
                        decision.selected_employee_id
                    );


                const date =
                    formatDate(
                        decision.decision_date
                        ||
                        decision.created_at
                    );



                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "dashboard-activity-row";



                row.innerHTML = `

                    <div class="activity-main">

                        <strong>
                            ${
                                escapeHtml(
                                    taskName
                                )
                            }
                        </strong>

                        <span>

                            تم الإسناد إلى
                            ${
                                escapeHtml(
                                    employeeName
                                )
                            }

                        </span>

                    </div>


                    <div class="decision-date">

                        ${
                            escapeHtml(
                                date
                            )
                        }

                    </div>

                `;



                container.appendChild(
                    row
                );


            }
        );

}



/* ==========================================
   تنسيق التاريخ
========================================== */

function formatDate(
    value
) {


    if (!value) {


        return "—";

    }



    const date =
        new Date(
            value
        );



    if (
        Number.isNaN(
            date.getTime()
        )
    ) {


        return value;

    }



    return date.toLocaleDateString(
        "ar-SA",
        {

            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit"

        }
    );

}



/* ==========================================
   تنظيف النص
========================================== */

function normalizeText(
    value
) {


    return String(
        value
        ||
        ""
    )
    .trim()
    .toLowerCase();

}



/* ==========================================
   حماية النص من HTML
========================================== */

function escapeHtml(
    value
) {


    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}



/* ==========================================
   تحميل كل بيانات الصفحة
========================================== */

async function loadDashboardData() {


    try {


        await Promise.all([

            loadEmployees(),

            loadProjects(),

            loadTasks()

        ]);



        await loadDecisions();


    }


    catch(error) {


        console.error(
            "خطأ تحميل لوحة التحكم:",
            error
        );



        document
            .getElementById(
                "matchingActivity"
            )
            .innerHTML = `

                <div class="empty-state">

                    تعذر تحميل الترشيحات

                </div>

            `;



        document
            .getElementById(
                "decisionsActivity"
            )
            .innerHTML = `

                <div class="empty-state">

                    تعذر تحميل القرارات

                </div>

            `;


    }

}



/* ==========================================
   القائمة الجانبية
========================================== */

const mobileMenuBtn =
    document.getElementById(
        "mobileMenuBtn"
    );


const sidebar =
    document.getElementById(
        "sidebar"
    );


const sidebarOverlay =
    document.getElementById(
        "sidebarOverlay"
    );



function openSidebar() {


    sidebar.classList.add(
        "show"
    );


    sidebarOverlay.classList.add(
        "show"
    );


    document.body.classList.add(
        "menu-open"
    );

}



function closeSidebar() {


    sidebar.classList.remove(
        "show"
    );


    sidebarOverlay.classList.remove(
        "show"
    );


    document.body.classList.remove(
        "menu-open"
    );

}



mobileMenuBtn
    .addEventListener(
        "click",
        openSidebar
    );



sidebarOverlay
    .addEventListener(
        "click",
        closeSidebar
    );



document
    .querySelectorAll(
        ".nav-link"
    )
    .forEach(
        function(link) {


            link.addEventListener(
                "click",
                closeSidebar
            );


        }
    );



/* ==========================================
   الانتقال
========================================== */

function goToPage(
    page
) {


    window.location.href =
        page;

}



/* ==========================================
   تنظيف الجلسة
========================================== */

function clearSession() {


    localStorage.removeItem(
        "miyarRole"
    );


    localStorage.removeItem(
        "miyarEmail"
    );


    localStorage.removeItem(
        "miyarEmployeeId"
    );


    localStorage.removeItem(
        "miyarEmployeeName"
    );

}



/* ==========================================
   تسجيل الخروج
========================================== */

async function logout() {


    try {


        await supabaseClient
            .auth
            .signOut();


    }


    catch(error) {


        console.error(
            "خطأ تسجيل الخروج:",
            error
        );


    }


    finally {


        clearSession();


        window.location.href =
            "login.html";


    }

}



document
    .getElementById(
        "logoutBtn"
    )
    .addEventListener(
        "click",
        logout
    );



/* ==========================================
   تشغيل الصفحة
========================================== */

async function startDashboard() {


    const allowed =
        await protectAdminPage();



    if (!allowed) {


        return;

    }



    await loadDashboardData();

}



startDashboard();


</script>


</body>

</html>
