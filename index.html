<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>معيار | الرئيسية</title>

    <link rel="stylesheet" href="home.css">
</head>

<body>

    <main class="home">

        <header class="header">
            <img
                src="assets/logo.png"
                alt="معيار"
                class="logo"
            >
        </header>

        <section class="hero">

            <div class="content">

                <h1>
                    اختيار الموظف
                    <span>الأنسب للمهمة</span>
                </h1>

                <p>
                    منصة تساعد المسؤول على تحليل مهارات الموظفين
                    وخبراتهم وتوفرهم وضغط العمل للوصول إلى أفضل
                    ترشيح للمهمة ودعم اتخاذ القرار.
                </p>

                <button onclick="goToLogin()">
                    تسجيل الدخول
                </button>

            </div>

        </section>

    </main>

    <script>
        function goToLogin() {
            window.location.href = "login.html";
        }
    </script>

</body>

</html>
